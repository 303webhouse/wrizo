<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrizo reorg prototype · Machina · a mockup, not app code</title>
<!-- Fonts as in Fable's frames. With no network the page falls back to system fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="reorg.css">
</head>
<body>
<!--
  A throwaway, clickable prototype with made-up content. Nothing here ships.
  Milestone 1: the shell, the left rail and a Project's own list (brief, section 6 A).
  Opens by double-click: plain HTML, CSS and JavaScript, no build, no server.
-->
<div id="shell" class="shell">
  <header id="bar" class="bar"></header>
  <nav id="rail" class="rail" aria-label="Left rail"></nav>
  <div id="pop"></div>
  <button type="button" class="handle handle-front" data-act="later" data-note="The Front menu comes in milestone 2." aria-label="Front menu (milestone 2)">&lsaquo;</button>
  <button type="button" class="handle handle-back" data-act="later" data-note="The Back menu comes in milestone 3." aria-label="Back menu (milestone 3)">&rsaquo;</button>
  <main id="page" class="page"></main>
  <div id="foot" class="foot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="state-tag" class="state-tag"></div>
  <input id="pick-colour" type="color" class="offstage" tabindex="-1" aria-hidden="true">
  <input id="pick-picture" type="file" accept="image/*" class="offstage" tabindex="-1" aria-hidden="true">
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
