<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrizo - Organizing big projects (Arbor)</title>
<!--
  docs/mockups/big-projects - organizing big projects, Arbor, ~2000 x 940.
  MODEL: you are always IN a place - a DRAWER (a project) or a JOURNAL (writing with no project).
         Drawer > SET (today's binder) > SECTION (one page or board). Set headings appear only with 2+ sets.
  RAIL (Nick picked A): a place block (icon + name + chevron, brass bracket over Pages and Boards), a divider, Journal;
         foot Settings, Themes, Trash. No Shelf; Plan is renamed Boards. The WHOLE rail, place block included, still fades
         while typing, the Recede way (unchanged behaviour; not animated in this mockup).  The place block opens the switcher: Drawers, then Journals, + New Drawer,
         + New Journal.  With 2+ Journals the Journal button opens a short list; with one it just goes there.
  PAGES / BOARDS pop-outs mirror each other, scoped to the place: name, + New Page / + New Board, SECTIONS with a sort
         (Order - drag to reorder, only here - Date, Tag, Most opened, Least opened), a rows / grid toggle. A set with no pages
         is absent from Pages (no boards: absent from Boards); a non-current set folds to one row with a count. X = out of the
         drawer into the Journal with an Undo line (never delete), + New set, then PRESETS.
  GRAFTS: "Connected to <page>" from any place, grouped Cards / Sources / Boards / Pages (X + Undo), then Shared tags.
         Items from another place carry a faint place label.
  PAGE "..." MENU: Copy Page, File Page..., Page Settings..., Delete.  File Page... = the picker pattern.
  Reused from cursor/side-panels-mockup round 2 unchanged: the Tutor panel, the details card (minus its place dropdown,
  removed here), the Add to a Board picker, and the Page Settings sheet (renamed from Page Setup).
  The rig bar is mockup only. Frames: see FRAMES at the bottom of the script (?frame=<name>).
  Branch: cursor/big-projects-mockup.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&display=swap');

  :root {
    --ink-950: #110600; --ink-900: #1F1A16; --ink-800: #2A241E;
    --ink-border: #332C25; --ink-border-strong: #453B31;
    --text-hi: #EDE6DA; --text-mid: #B5A998; --text-low: #80766A;
    --paper: #F3EDE1; --paper-dim: #E9E1D2;
    --ink-on-paper: #2B2014; --ink-on-paper-low: #6B5F4E;
    --paper-glow: 0 0 0 1px rgba(243, 237, 225, 0.06), 0 4px 32px rgba(212, 162, 78, 0.10), 0 2px 12px rgba(0, 0, 0, 0.45);
    --brass: #ff9800; --accent-rest: #96a05a;
    --desk-ground: #1F1A16;
    --font-ui: 'Figtree', system-ui, sans-serif;
    --font-prose: 'Crimson Pro', Georgia, serif;
    --sb: color-mix(in srgb, var(--text-low) 28%, transparent);
    --strip: 84px; --lt: 304px; --rt: 332px; --gap: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; scrollbar-width: thin; scrollbar-color: var(--sb) transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--ink-950); color: var(--text-hi); font-family: var(--font-ui); user-select: none; }
  button, input, textarea { font: inherit; color: inherit; background: none; border: 0; }
  button { cursor: pointer; }
  svg { display: block; }

  .rig { position: fixed; inset: 0 0 auto 0; z-index: 90; height: 34px; display: flex; align-items: center; gap: 6px;
    padding: 0 12px; background: #000; border-bottom: 1px solid #222; font-size: 11px; color: #9a9a9a; overflow: hidden; white-space: nowrap; }
  .rig b { color: #d8d8d8; letter-spacing: .06em; }
  .only { color: #6e6e6e; letter-spacing: .12em; text-transform: uppercase; font-size: 9px; border: 1px solid #333; padding: 2px 6px; }
  .rev { height: 22px; padding: 0 8px; border: 1px solid #333; color: #c8c8c8; background: #141414; font-size: 11px; }
  .rev[data-on='true'] { border-color: var(--accent-rest); color: var(--accent-rest); }
  .rig .sp { width: 8px; }
  .rig .fr { margin-left: auto; color: #6a6a6a; }

  /* ---- the rail ---- */
  .strip { position: fixed; top: 92px; left: 0; bottom: 0; width: var(--strip); z-index: 5; display: flex; flex-direction: column; padding: 8px 0 5vh;
    background: var(--desk-ground); border: 1px solid var(--ink-border); border-top: none; }
  .ssep { height: 1px; background: var(--ink-border); margin: 8px 10px; }
  .sfoot { margin-top: auto; }
  .si { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; padding: 10px 4px; color: var(--text-hi); }
  .si:hover { background: var(--ink-900); }
  .si:active { color: var(--brass); }
  .si[aria-pressed='true'] { color: var(--accent-rest); }
  .si svg { width: 21.6px; height: 21.6px; }
  .si span { font-size: 10.8px; letter-spacing: .4px; line-height: 1.2; }
  .sfoot .si svg { width: 14.5px; height: 14.5px; }
  .sfoot .si span { font-size: 7.3px; }
  /* the place block + its bracket: Pages and Boards belong to the place */
  .bracket { position: relative; margin: 2px 0 0; padding-left: 4px; }
  .bracket::before { content: ''; position: absolute; left: 4px; top: 2px; bottom: 2px; width: 5px; border: 1.5px solid var(--brass); border-right: none; pointer-events: none; }
  .place { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; padding: 10px 6px 10px 8px; color: var(--text-hi); }
  .place:hover, .place[aria-expanded='true'] { background: var(--ink-900); }
  .place svg { width: 21.6px; height: 21.6px; color: var(--brass); }
  .place .nm { max-width: 100%; font-size: 11px; font-weight: 600; line-height: 1.2; text-align: center;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .place .chev { font-size: 8px; color: var(--text-low); line-height: 1; }

  .app { position: fixed; top: 34px; left: var(--strip); right: 0; bottom: 0; display: grid;
    grid-template-columns: var(--lt) 1fr var(--rt); grid-template-rows: 58px 1fr; column-gap: var(--gap); padding: 0 28px 22px; }

  /* ---- top bar ---- */
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .crumb { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-low); min-width: 0; margin-right: auto; }
  .crumb .sep { color: var(--ink-border-strong); }
  .here { display: flex; align-items: center; gap: 6px; color: var(--text-mid); font-weight: 600; padding: 4px 6px; margin: -4px -6px; border: 1px solid transparent; }
  .here:hover, .here[aria-expanded='true'] { color: var(--text-hi); border-color: var(--ink-border); }
  .here i { font-style: normal; font-weight: 400; font-size: 9px; color: var(--text-low); }
  .dots { width: 26px; height: 24px; color: var(--text-low); font-size: 15px; letter-spacing: 1px; border: 1px solid transparent; }
  .dots:hover, .dots[aria-expanded='true'] { color: var(--text-hi); border-color: var(--ink-border); }
  .modes { display: flex; align-items: center; gap: 1.6px; }
  .modes[hidden] { display: none; }
  .mt { border: 1px solid transparent; padding: 9px 12.8px; font-size: 10.4px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-mid); }
  .mt:hover { color: var(--text-hi); background: var(--ink-800); }
  .mt.on { color: var(--text-hi); border-bottom-color: var(--accent-rest); }
  .mt.off { color: var(--text-low); cursor: not-allowed; }
  .mt.off:hover { background: none; color: var(--text-low); }
  .plan { padding: 9px 12.8px; font-size: 10.4px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-rest); }

  /* ---- tracks ---- */
  .track { position: relative; min-height: 0; display: flex; flex-direction: column; }
  .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: var(--ink-900); border: 1px solid var(--ink-border); overflow: hidden; }
  .panel[hidden] { display: flex; visibility: hidden; }
  .lab { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-low); }

  /* sort control: a small menu of five */
  .sortw { position: relative; }
  .sort { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-low); padding: 2px 4px; margin: -2px -4px; }
  .sort:hover, .sort[aria-expanded='true'] { color: var(--text-mid); }
  .sort::after { content: ''; width: 5px; height: 5px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: translateY(-2px) rotate(45deg); opacity: .7; }
  .sortm { position: absolute; right: -6px; top: calc(100% + 6px); z-index: 20; min-width: 140px; padding: 4px 0; background: var(--ink-900); border: 1px solid var(--ink-border-strong); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .sortm[hidden] { display: none; }
  .sortm button { display: flex; justify-content: space-between; width: 100%; padding: 6px 12px; text-align: left; font-size: 12px; color: var(--text-mid); }
  .sortm button:hover { background: var(--ink-800); color: var(--text-hi); }
  .sortm button[aria-checked='true'] { color: var(--text-hi); }
  .sortm button[aria-checked='true']::after { content: '✓'; color: var(--accent-rest); }
  .views { display: flex; border: 1px solid var(--ink-border); }
  .views button { width: 24px; height: 20px; display: grid; place-items: center; color: var(--text-low); }
  .views button + button { border-left: 1px solid var(--ink-border); }
  .views button[aria-pressed='true'] { color: var(--accent-rest); }
  .views svg { width: 12px; height: 12px; }

  /* ---- the Pages / Boards pop-out ---- */
  .pophead { padding: 14px 14px 10px; display: flex; align-items: center; gap: 8px; }
  .pophead svg { width: 15px; height: 15px; color: var(--brass); flex: 0 0 auto; }
  .pophead .pn { font-size: 13px; font-weight: 600; color: var(--text-hi); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .newbtn { display: flex; align-items: center; gap: 8px; margin: 0 10px 6px; height: 34px; padding: 0 10px; border: 1px solid var(--ink-border-strong); color: var(--text-mid); font-size: 13px; }
  .newbtn:hover { color: var(--text-hi); border-color: var(--text-low); }
  .newbtn b { font-weight: 400; font-size: 15px; line-height: 1; color: var(--text-low); }
  .tools { display: flex; align-items: center; gap: 12px; padding: 10px 14px 6px; }
  .tools .lab { margin-right: auto; }
  .popbody { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 0 10px; }
  .sethead { padding: 14px 14px 5px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-mid); }
  .setfold { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 14px 5px; text-align: left; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-mid); }
  .setfold:hover { color: var(--text-hi); }
  .setfold .cv { font-size: 9px; color: var(--text-low); width: 8px; transition: transform .12s; }
  .setfold[aria-expanded='true'] .cv { transform: rotate(90deg); }
  .setfold .ct { margin-left: auto; letter-spacing: 0; font-size: 11px; color: var(--text-low); }
  .taghead { padding: 10px 14px 3px; font-size: 10.5px; color: var(--text-low); }
  .taghead::before, .tagm::before { content: '#'; margin-right: 3px; opacity: .7; }
  .row { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 30px 6px 12px; border-left: 2px solid transparent; text-align: left; color: var(--text-mid); }
  .row:hover, .row.hover { background: var(--ink-800); color: var(--text-hi); }
  .row[aria-current='true'] { color: var(--text-hi); border-left-color: var(--accent-rest); background: color-mix(in srgb, var(--ink-800) 70%, transparent); }
  .row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .row .t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .fl { font-size: 11px; color: var(--text-low); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-prose); font-size: 12.5px; }
  .row[data-drag='true'] { cursor: grab; }
  .row.dragging { opacity: .4; }
  .row.over { box-shadow: inset 0 2px 0 var(--accent-rest); }
  .x { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; display: grid; place-items: center; color: var(--text-mid); font-size: 16px; line-height: 1; opacity: 0; }
  .row:hover .x, .row.hover .x, .tile:hover .x, .x:focus-visible, .gr:hover .x { opacity: 1; }
  .x:hover { color: var(--text-hi); }
  .mini { flex: 0 0 auto; width: 20px; height: 27px; background: var(--paper); border: 1px solid var(--ink-border-strong); position: relative; }
  .mini::before { content: ''; position: absolute; left: 4px; right: 4px; top: 6px; height: 9px; background: repeating-linear-gradient(to bottom, var(--ink-on-paper-low) 0 1px, transparent 1px 3px); opacity: .55; }
  .minib { flex: 0 0 auto; width: 36px; height: 23px; background: var(--paper-dim); border: 1px solid var(--ink-border-strong); position: relative; }
  .minib i { position: absolute; width: 8px; height: 6px; background: var(--paper); border: 1px solid var(--ink-on-paper-low); opacity: .7; }
  .grid { display: grid; gap: 10px; padding: 6px 14px; }
  .grid.p { grid-template-columns: repeat(4, 1fr); }
  .grid.b { grid-template-columns: repeat(2, 1fr); }
  .tile { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; color: var(--text-mid); }
  .tile:hover { color: var(--text-hi); }
  .tile .th { position: relative; width: 100%; background: var(--paper); border: 1px solid var(--ink-border-strong); overflow: hidden; }
  .grid.p .th { aspect-ratio: 3 / 4; padding: 8px 7px; font-family: var(--font-prose); font-size: 7px; line-height: 1.35; color: var(--ink-on-paper-low); }
  .grid.b .th { aspect-ratio: 16 / 10; background: var(--paper-dim); }
  .grid.b .th i { position: absolute; width: 22%; height: 22%; background: var(--paper); border: 1px solid var(--ink-on-paper-low); opacity: .7; }
  .tile[aria-current='true'] .th { outline: 2px solid var(--accent-rest); outline-offset: 1px; }
  .tile .t { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .x { top: 4px; right: 4px; transform: none; background: var(--ink-900); border: 1px solid var(--ink-border-strong); }
  .popfoot { border-top: 1px solid var(--ink-border); padding: 8px 0 6px; }
  .lnk { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 14px; text-align: left; color: var(--text-mid); font-size: 12.5px; }
  .lnk:hover { color: var(--text-hi); background: var(--ink-800); }
  .lnk b { font-weight: 400; color: var(--text-low); width: 10px; }
  .presets .lab { display: block; padding: 10px 14px 4px; }
  .undo { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--ink-border-strong); background: var(--ink-800); font-size: 12px; color: var(--text-mid); }
  .undo[hidden] { display: none; }
  .undo span { flex: 1; min-width: 0; }
  .undo button { color: var(--text-hi); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
  .empty-note { padding: 14px; font-size: 12px; color: var(--text-low); }

  /* ---- switcher, journal list, file picker: the picker pattern ---- */
  .pick { position: fixed; z-index: 72; width: 248px; display: flex; flex-direction: column; padding: 4px 0; background: var(--ink-900); border: 1px solid var(--ink-border-strong); box-shadow: 0 10px 34px rgba(0,0,0,.5); }
  .pick[hidden] { display: none; }
  .pick .lab { padding: 9px 14px 4px; }
  .pick .pr { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 14px; text-align: left; color: var(--text-mid); font-size: 13px; }
  .pick .pr:hover { background: var(--ink-800); color: var(--text-hi); }
  .pick .pr svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--text-low); }
  .pick .pr .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .pr .k { font-size: 10.5px; color: var(--text-low); }
  .pick .pr[aria-current='true'] { color: var(--text-hi); }
  .pick .pr[aria-current='true'] svg { color: var(--brass); }
  .pick .pr[aria-current='true']::after, .pick .pr[aria-checked='true']::after { content: '✓'; color: var(--accent-rest); font-size: 12px; }
  .pick .pr.sub { padding-left: 37px; font-size: 12.5px; }
  .pick .chev { font-size: 9px; color: var(--text-low); transition: transform .12s; }
  .pick .pr[aria-expanded='true'] .chev { transform: rotate(90deg); }
  .pick hr { border: 0; border-top: 1px solid var(--ink-border); margin: 4px 0; }
  .pick .add { color: var(--text-mid); }
  .pick .add b { font-weight: 400; color: var(--text-low); width: 14px; text-align: center; }

  /* ---- reused from round 2: details card, Add to a Board picker, page menu, Page Settings sheet ---- */
  .card { position: fixed; z-index: 70; width: 300px; padding: 14px; background: var(--ink-900); border: 1px solid var(--ink-border-strong); box-shadow: 0 10px 34px rgba(0,0,0,.5); }
  .card[hidden], .picker[hidden], .menu[hidden], .sheet[hidden] { display: none; }
  .det { display: flex; flex-direction: column; gap: 12px; }
  .det .f { display: flex; flex-direction: column; gap: 5px; }
  .det input.title { width: 100%; height: 30px; padding: 0 8px; border: 1px solid var(--ink-border-strong); color: var(--text-hi); font-size: 14px; font-weight: 500; user-select: text; }
  .det input.title:focus { outline: none; border-color: var(--accent-rest); }
  .det .rw { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .star { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--ink-border-strong); color: var(--text-mid); font-size: 12px; }
  .star b { font-weight: 400; font-size: 13px; }
  .star[aria-pressed='true'] { color: var(--text-hi); }
  .star[aria-pressed='true'] b { color: var(--accent-rest); }
  .tag { height: 22px; display: inline-flex; align-items: center; padding: 0 8px; background: var(--ink-800); color: var(--text-mid); font-size: 11.5px; }
  .addtag { height: 22px; padding: 0 6px; color: var(--text-low); font-size: 11.5px; border: 1px dashed var(--ink-border-strong); }
  .addboard { width: 100%; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid var(--ink-border-strong); color: var(--text-mid); font-size: 12.5px; }
  .addboard:hover, .addboard[aria-expanded='true'] { color: var(--text-hi); border-color: var(--text-low); }
  .pinned { font-size: 11.5px; color: var(--text-low); line-height: 1.5; }
  .pinned:empty { display: none; }
  .pinned em { font-style: normal; color: var(--text-mid); }
  .picker { position: fixed; z-index: 72; width: 240px; display: flex; flex-direction: column; padding: 4px 0; background: var(--ink-900); border: 1px solid var(--ink-border-strong); box-shadow: 0 10px 34px rgba(0,0,0,.5); }
  .picker .pr { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 7px 14px; text-align: left; color: var(--text-mid); font-size: 13px; }
  .picker .pr:hover { background: var(--ink-800); color: var(--text-hi); }
  .picker .pr b { flex: 0 0 auto; width: 10px; font-weight: 400; color: var(--text-low); }
  .picker .pr .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker .pr[aria-checked='true'] b { color: var(--accent-rest); }
  .picker .new { border-bottom: 1px solid var(--ink-border); padding-bottom: 9px; margin-bottom: 2px; }
  .picker .psort { display: flex; justify-content: flex-end; padding: 4px 14px 2px; }
  .picker .psort[hidden] { display: none; }
  .picker .plistb { max-height: 236px; overflow-y: auto; overflow-x: hidden; }
  .menu { position: fixed; z-index: 70; min-width: 200px; padding: 4px 0; background: var(--ink-900); border: 1px solid var(--ink-border-strong); box-shadow: 0 10px 34px rgba(0,0,0,.5); }
  .menu button { display: block; width: 100%; padding: 7px 14px; text-align: left; color: var(--text-mid); font-size: 13px; }
  .menu button:hover { background: var(--ink-800); color: var(--text-hi); }
  .menu hr { border: 0; border-top: 1px solid var(--ink-border); margin: 4px 0; }
  .sheet { position: fixed; z-index: 75; width: 360px; padding: 16px 18px 14px; background: var(--ink-900); border: 1px solid var(--ink-border-strong); box-shadow: 0 14px 44px rgba(0,0,0,.55); }
  .sheet h2 { font-size: 13px; font-weight: 600; color: var(--text-hi); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 button { color: var(--text-low); font-size: 16px; line-height: 1; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
  .srow > .sl { flex: 0 0 96px; font-size: 12.5px; color: var(--text-mid); }
  .seg { display: flex; border: 1px solid var(--ink-border-strong); }
  .seg button, .tog { min-width: 52px; height: 26px; padding: 0 8px; font-size: 11.5px; color: var(--text-low); }
  .seg button + button { border-left: 1px solid var(--ink-border-strong); }
  .seg button[aria-checked='true'], .tog[aria-pressed='true'] { color: var(--brass); background: color-mix(in srgb, var(--brass) 8%, transparent); }
  .tog { border: 1px solid var(--ink-border-strong); }
  .range { flex: 1; accent-color: var(--brass); }
  .rval { flex: 0 0 26px; font-size: 12px; color: var(--text-mid); text-align: right; }
  .snote { margin-top: 8px; font-size: 10.5px; line-height: 1.45; color: var(--text-low); }
  .sfootb { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .sfootb button { height: 28px; padding: 0 12px; border: 1px solid var(--ink-border-strong); color: var(--text-mid); font-size: 12px; }

  /* ---- the page / the board ---- */
  .pagecol { position: relative; min-height: 0; display: flex; justify-content: center; }
  .page { width: 820px; max-width: 100%; height: 100%; background: var(--paper); box-shadow: var(--paper-glow); overflow: hidden; }
  .page[hidden], .board[hidden] { display: none; }
  .sheetpage { padding: 76px 96px; color: var(--ink-on-paper); font-family: var(--font-prose); font-size: 20px; line-height: var(--lh, 1.7); user-select: text; }
  .sheetpage h1 { font-size: 15px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-on-paper-low); margin-bottom: 1.6em; font-family: var(--font-ui); }
  .sheetpage p + p { margin-top: 1em; }
  .sheetpage ::selection { background: rgba(150, 160, 90, .32); }
  .board { width: 100%; height: 100%; background: var(--paper-dim); box-shadow: var(--paper-glow); display: grid; place-items: center; }
  .starters { display: flex; gap: 12px; }
  .starters button { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 16px; border: 1px solid var(--ink-on-paper-low); color: var(--ink-on-paper); font-size: 13.5px; background: var(--paper); }
  .starters button:hover { border-color: var(--ink-on-paper); }
  .starters svg { width: 16px; height: 16px; }

  /* ---- right: Tutor (reused) + Grafts ---- */
  .tabs { display: flex; border-bottom: 1px solid var(--ink-border); flex: 0 0 auto; }
  .tab { padding: 13px 14px 9px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-low); border-bottom: 1px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text-mid); }
  .tab[aria-selected='true'] { color: var(--accent-rest); border-bottom-color: var(--accent-rest); }
  .tbody { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .tbody[hidden] { display: none; }
  .ask { display: flex; flex-direction: column; border: 1px solid var(--ink-border-strong); background: var(--ink-950); }
  .ask:focus-within { border-color: var(--accent-rest); }
  .ask textarea { height: 64px; resize: none; padding: 10px 11px 4px; font-size: 13.5px; line-height: 1.4; color: var(--text-hi); user-select: text; }
  .ask textarea::placeholder { color: var(--text-low); }
  .ask textarea:focus { outline: none; }
  .ask .bar { display: flex; justify-content: flex-end; padding: 4px 6px 6px; }
  .send { height: 24px; padding: 0 10px; font-size: 11.5px; color: var(--text-low); border: 1px solid var(--ink-border); }
  .send:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { max-width: 100%; padding: 4px 9px; border: 1px solid var(--ink-border); color: var(--text-mid); font-size: 11.5px; line-height: 1.35; text-align: left; }
  .chip:hover:not(:disabled) { color: var(--text-hi); border-color: var(--ink-border-strong); background: var(--ink-800); }
  .chip:disabled { color: var(--ink-border-strong); border-style: dashed; cursor: default; }
  .quiet { margin-top: auto; display: flex; flex-direction: column; border-top: 1px solid var(--ink-border); }
  .lens > button { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 0; color: var(--text-low); font-size: 12px; border-bottom: 1px solid var(--ink-border); }
  .lens > button:hover { color: var(--text-mid); }
  .lens .n { font-size: 11px; color: var(--text-low); }
  .gbody { padding: 0; gap: 0; }
  .ghead { display: flex; align-items: center; gap: 10px; padding: 14px 14px 6px; }
  .ghead .gt { margin-right: auto; font-size: 12.5px; color: var(--text-mid); }
  .ghead .gt em { font-style: normal; color: var(--text-hi); font-weight: 600; }
  .gl { padding: 12px 14px 3px; }
  .gr { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 30px 6px 14px; color: var(--text-mid); font-size: 13px; }
  .gr:hover { background: var(--ink-800); color: var(--text-hi); }
  .gr .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gr .plc { margin-left: auto; flex: 0 0 auto; font-size: 10.5px; color: var(--text-low); opacity: .7; }
  .gr .k { flex: 0 0 auto; }
  .gk-card { width: 18px; height: 14px; background: var(--paper); border: 1px solid var(--ink-border-strong); }
  .gk-src { width: 14px; height: 18px; background: var(--paper-dim); border: 1px solid var(--ink-border-strong); border-left-width: 3px; }
  .tagm { flex: 0 0 auto; font-size: 11px; color: var(--text-low); }
  .gr.tagged { padding-right: 14px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="app">

        <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="8" height="10"/><rect x="14" y="10" width="7" height="10"/><path d="M11 9h3v5"/></svg>Connect Pages</button>

<script>
  var $ = function (s) { return document.querySelector(s); };
  var qs = new URLSearchParams(location.search);

  var ICON = {
    drawer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="8" rx="1"/><rect x="4" y="13" width="16" height="8" rx="1"/><path d="M10 7h4M10 17h4"/></svg>',
    journal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16.5A1.5 1.5 0 0 1 17.5 21H6.5A2.5 2.5 0 0 1 4 18.5v-13Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H19"/></svg>',
    rows: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 2.5h10M1 6h10M1 9.5h10"/></svg>',
    grid: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="4" height="4"/><rect x="7" y="1" width="4" height="4"/><rect x="1" y="7" width="4" height="4"/><rect x="7" y="7" width="4" height="4"/></svg>'
  };

  // ---------------- sample data ----------------
  function pg(t, fl, tag, d, op) { return { id: 'p' + Math.random().toString(36).slice(2, 8), kind: 'page', t: t, fl: fl, tag: tag, d: d, op: op }; }
  function bd(t, n, tag, d, op) { return { id: 'b' + Math.random().toString(36).slice(2, 8), kind: 'board', t: t, n: n, tag: tag, d: d, op: op }; }
  var CH = [
    'The ferry was late the night Mara came home.', 'Nobody on the quay would say her brother’s name.', 'The kettle clicks off and she still doesn’t turn around.',
    'Morning, and the marsh had moved again.', 'Their mother’s coat still hung by the door.', 'The Quay families kept their own calendar.',
    'He found the ledger under the floorboards.', 'Rain all week, and the river rising with it.', 'She went to the harbour office alone.',
    'Nobody had seen the ferryman since March.', 'The last crossing was the one they never talked about.', 'In the end it was only water.'
  ];
  var TAGS = ['revised', 'revised', 'revised', 'revised', 'first draft', 'first draft', 'first draft', 'first draft', 'first draft', 'to write', 'to write', 'to write'];
  var OPENS = [14, 9, 22, 6, 4, 3, 5, 2, 2, 1, 0, 0];
  function chapters() { return CH.map(function (fl, i) { return pg('Ch ' + (i + 1), fl, TAGS[i], 40 - i * 3, OPENS[i]); }); }
  var DATA, PLACE, ch3, cur;
  function fresh() {
    var manuscript = [pg('Title Page', 'THE LATE FERRY · a novel', 'front matter', 50, 3)].concat(chapters(), [pg('Bibliography', 'Ashworth, M. Tides of the Estuary (1987).', 'back matter', 12, 2)]);
    DATA = {
      drawers: [
        { id: 'ferry', name: 'The Late Ferry', sets: [
          { name: 'Manuscript', pages: manuscript, boards: [bd('Chapter map', 14, 'structure', 3, 11), bd('Timeline', 22, 'structure', 8, 4)] },
          { name: 'Worldbuilding', pages: [],
            boards: [bd('The Marsh family', 12, 'people', 20, 6), bd('The Quay families', 8, 'people', 18, 3), bd('Locations', 9, 'places', 15, 5), bd('Mood', 16, 'mood', 30, 2)] }
        ] },
        { id: 'short', name: 'Short stories', sets: [
          { name: 'Stories', pages: [pg('The Lighthouse Keeper', 'He counted ships the way other men counted sheep.', 'draft', 5, 7), pg('Salt', 'The sea came in through the kitchen.', 'ferry', 9, 4),
            pg('Visiting Hours', 'Tuesday, and the corridor smelled of oranges.', 'draft', 14, 2), pg('Small Rain', 'It rained the whole of her twelfth year.', 'idea', 25, 1)],
            boards: [bd('Story ideas', 7, 'ideas', 6, 3)] }
        ] },
        { id: 'top', name: 'Top Drawer', sets: [{ name: 'Top Drawer', pages: [pg('First page', 'Start anywhere.', 'idea', 60, 1)], boards: [] }] }
      ],
      journals: [
        { id: 'journal', name: 'Journal', pages: [pg('Kettle notes', 'The kettle as a clock.', 'notes', 0, 3), pg('Ferry dream', 'I dreamt the ferry had no pilot.', 'ferry', 1, 2), pg('Free write, Oct 16', 'Ten minutes on the quay.', 'free write', 2, 1),
          pg('Harbour photo, 1962', 'From the library box: the old pier.', 'source', 6, 2), pg('Names', 'Mara, Ned, the ferryman (no name yet).', 'notes', 9, 4), pg('Free write, Oct 2', 'What the marsh sounds like at night.', 'free write', 16, 1)], boards: [] },
        { id: 'poems', name: 'Poems', pages: [pg('Low tide', 'the mud remembers every foot', 'poem', 3, 2), pg('November', 'a gull, a bin lid, the wind', 'poem', 11, 1)], boards: [] }
      ]
    };
    ch3 = DATA.drawers[0].sets[0].pages[3]; cur = ch3;
    PLACE = { kind: 'drawer', id: 'ferry' };
  }
  fresh();

  var S = { rail: 'A', folded: {}, pop: null, view: { pages: 'rows', boards: 'grid' }, sort: { pages: 'Order', boards: 'Order', pagesJ: 'Date', boardsJ: 'Date', grafts: 'Order' }, oneJournal: false, surface: 'page', undo: null, gundo: null, tab: 'tutor' };
  var SORTS = ['Order', 'Date', 'Tag', 'Most opened', 'Least opened'];

  function placeObj() { return PLACE.kind === 'drawer' ? DATA.drawers.find(function (d) { return d.id === PLACE.id; }) : DATA.journals.find(function (j) { return j.id === PLACE.id; }); }
  function journals() { return S.oneJournal ? DATA.journals.slice(0, 1) : DATA.journals; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function findHome(item) {
    var out = null;
    DATA.drawers.forEach(function (d) { d.sets.forEach(function (s) { if (s.pages.indexOf(item) >= 0 || s.boards.indexOf(item) >= 0) out = { drawer: d, set: s }; }); });
    DATA.journals.forEach(function (j) { if (j.pages.indexOf(item) >= 0) out = { journal: j }; });
    return out;
  }

  // ---------------- rail ----------------
  function renderRail() {
    var p = placeObj();
    $('#placeIcon').innerHTML = PLACE.kind === 'drawer' ? ICON.drawer : ICON.journal;
    $('#placeName').textContent = p.name;
    $('#placeBtn').title = p.name;
    $('#railPages').setAttribute('aria-pressed', String(S.pop === 'pages'));

    $('#onej').dataset.on = String(S.oneJournal);
    $('#boardsurf').dataset.on = String(S.surface === 'board');
  }

  // ---------------- crumb + page ----------------
  function renderCrumb() {
    var c = $('#crumb'), h = findHome(cur), parts = [];
    if (S.surface === 'board') { parts = [placeObj().name]; c.innerHTML = '<span>' + esc(parts[0]) + '</span><span class="sep">›</span><button class="here" type="button" disabled>Untitled board</button><button class="dots" type="button" aria-label="Board menu">···</button>'; return; }
    if (h && h.drawer) { parts.push(h.drawer.name); if (h.drawer.sets.length > 1) parts.push(h.set.name); }

    c.innerHTML = parts.map(function (p) { return '<span>' + esc(p) + '</span><span class="sep">›</span>'; }).join('') +
      '<button class="here" id="here" type="button" aria-haspopup="dialog" aria-expanded="false"><span>' + esc(cur.t) + '</span><i>▾</i></button>' +
      '<button class="dots" id="dots" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Page menu">···</button>';
    $('#here').addEventListener('click', function (e) { e.stopPropagation(); toggleOverlay('card', this); });

    closeAll();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });

  // ---------------- rig ----------------
  $('#onej').addEventListener('click', function () { S.oneJournal = !S.oneJournal; if (S.oneJournal && PLACE.kind === 'journal') PLACE = { kind: 'journal', id: 'journal' }; closeAll(); render(); });
  $('#boardsurf').addEventListener('click', function () { S.surface = S.surface === 'board' ? 'page' : 'board'; closeAll(); render(); });
  $('#reset').addEventListener('click', function () { location.search = ''; });

  function render() { renderRail(); renderCrumb(); renderSurface(); renderPop(); renderGrafts(); renderTabs(); }

  // ---------------- frames ----------------
  var FRAMES = {
    'rail-A':          function () { S.rail = 'A'; },
    'switcher-open':   function () { S.pop = 'pages'; return function () { toggleOverlay('switcher', $('#placeBtn'), 'right'); }; },
    'pages-rows':      function () { S.pop = 'pages'; },
    'pages-grid':      function () { S.pop = 'pages'; S.view.pages = 'grid'; },
    'pages-sort-tag':  function () { S.pop = 'pages'; S.sort.pages = 'Tag'; },
    'one-set-drawer':  function () { PLACE = { kind: 'drawer', id: 'short' }; cur = DATA.drawers[1].sets[0].pages[1]; $('#titlein').value = cur.t; S.pop = 'pages'; },
    'boards-grid':     function () { S.pop = 'boards'; },
    'grafts':          function () { S.pop = 'pages'; S.tab = 'grafts'; },
    'journal-place':   function () { PLACE = { kind: 'journal', id: 'journal' }; cur = DATA.journals[0].pages[0]; $('#titlein').value = cur.t; S.pop = 'pages'; },
    'journals-list':   function () { S.pop = 'pages'; return function () { toggleOverlay('jlist', $('#railJournal'), 'right'); }; },
    'file-page-picker':function () { S.pop = 'pages'; return function () { $('#dots').click(); $('#openfile').click(); }; },
    'page-menu':       function () { S.pop = 'pages'; return function () { $('#dots').click(); }; },
    'undo-line':       function () { S.pop = 'pages'; var set = DATA.drawers[0].sets[0]; toJournal(set.pages[7], set.pages); },
    'empty-board':     function () { S.surface = 'board'; S.pop = 'boards'; },
    'row-hover':       function () { S.pop = 'pages'; return function () { document.querySelectorAll('#pop .row').forEach(function (r) { if (r.querySelector('.t').textContent === 'Ch 4') r.classList.add('hover'); }); }; }
  };
  var frame = qs.get('frame'), after = null;
  if (frame && FRAMES[frame]) after = FRAMES[frame]();
  $('#frname').textContent = frame ? 'frame: ' + frame : '';
  render();
  if (after) after();
  if (document.fonts && after) document.fonts.ready.then(function () { closeAll(); after(); });
</script>
</body>
</html>
