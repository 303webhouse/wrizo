<!DOCTYPE html>
<html lang="en">
<head>

<title>Board kinds</title>

<style>

    linear-gradient(var(--choice), var(--choice)) top right / 1px 16px no-repeat,

    linear-gradient(var(--choice), var(--choice)) bottom left / 1px 16px no-repeat,

    linear-gradient(var(--choice), var(--choice)) bottom right / 1px 16px no-repeat; }
  .card h1 { font-family: 'Crimson Pro', Georgia, serif; font-weight: 500; font-size: 30px; display: flex; align-items: center; gap: 8px; }

  html[data-theme='flux'] .ask { color: var(--muted); border-radius: 2px; }

  .pophelp em { display: block; margin-top: 8px; font-family: 'Crimson Pro', Georgia, serif; font-style: italic; font-size: 15px; color: var(--olive); }
  .pophelp .more { display: inline-block; margin-top: 10px; color: var(--choice); font-size: 13px; }
  .doors { display: flex; gap: 8px; margin-top: 22px; }

  html[data-mode='light'] .tcard { box-shadow: 0 8px 18px rgba(43,32,20,.08); }
  .tcard strong, .lcard strong { font-family: 'Crimson Pro', Georgia, serif; font-weight: 500; font-size: 16px; display: block; }
  .tcard .q, .lcard .q { font-size: 13.5px; margin-top: 6px; }

  .flip { height: 100%; display: flex; align-items: center; justify-content: center; gap: 22px; }
  .turn { color: var(--low); font-size: 28px; width: 36px; }
  .sheet { width: 420px; height: min(600px, 84%); background: var(--card); color: var(--card-ink); border: 1px solid var(--card-line); border-radius: 3px; padding: 52px 44px; position: relative; box-shadow: 0 0 0 1.5px var(--choice), 0 18px 48px rgba(0,0,0,.28); }
  .sheet h1 { font-family: 'Crimson Pro', Georgia, serif; font-weight: 500; font-size: 32px; }
  .sheet p { font-family: 'Crimson Pro', Georgia, serif; font-size: 19px; line-height: 1.55; margin-top: 16px; }
  .sheet .num { position: absolute; bottom: 20px; right: 26px; color: var(--olive); font-size: 12px; }
  .thumbs { height: 100%; display: flex; gap: 14px; align-items: center; justify-content: center; }
  .pthumb { width: 112px; height: 164px; background: var(--card); color: var(--card-ink); border: 1px solid var(--card-line); border-radius: 3px; padding: 12px; }
  .pthumb.on { box-shadow: 0 0 0 1.5px var(--choice); }

  .mini { height: calc(100% - 46px); background: var(--stage); border: 1px solid var(--line); border-radius: 6px; position: relative; overflow: hidden; }
  .mini-as { position: absolute; top: 10px; right: 10px; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--choice); border-radius: 7px; padding: 4px; }
  .ghost { position: absolute; width: 42%; height: 16%; border: 1px solid var(--low); border-radius: 3px; background: var(--card); opacity: .45; }
  .ghost.a { left: 10%; top: 28%; } .ghost.b { left: 44%; top: 48%; } .ghost.c { left: 16%; top: 68%; }
  .mini-card { position: absolute; left: 10%; right: 10%; top: 16%; background: var(--card); color: var(--card-ink); border-radius: 4px; padding: 12px 12px 22px; box-shadow: 0 0 0 1.5px var(--choice); }

  html[data-frame='phone'] .shell { display: block; }
  html[data-frame='phone'] .tools, html[data-frame='phone'] .side, html[data-frame='phone'] .modes, html[data-frame='phone'] .gaps { display: none; }

  html[data-frame='phone'] .q { font-size: 15px; }

<body>
<header class="top">
  <strong class="brand" id="brand"></strong>
  <span class="where" id="where"></span>
  <span class="gaps" id="gaps"></span>
  <div class="top-right">
    <div id="showslot"></div>
    <nav class="modes" id="modes"></nav>
  </div>
</header>
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <section class="pop" id="pop"></section>
  <aside class="tools" id="tools"></aside>
  <main class="stage" id="stage"></main>
  <aside class="side" id="side"></aside>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var frame = q.get('frame') || 'listing';
  var theme = q.get('theme') || 'arbor';
  var mode = q.get('mode') || 'dark';
  var root = document.documentElement;
  root.dataset.frame = frame;
  root.dataset.theme = theme;
  root.dataset.mode = mode;
  var flux = theme === 'flux';
  var I = {
    open: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="8" height="6" rx="1"/><rect x="13" y="4" width="8" height="6" rx="1"/><rect x="3" y="13" width="8" height="6" rx="1"/><rect x="13" y="13" width="8" height="6" rx="1"/></svg>',
    storyboard: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><rect x="17" y="4" width="5" height="16" rx="1"/></svg>',
    outline: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h11M8 17h12"/></svg>',
    walk: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 16c3-7 6-7 8 0s5 7 8 0"/><circle cx="6" cy="16" r="1.2" fill="currentColor"/><circle cx="18" cy="16" r="1.2" fill="currentColor"/></svg>',
    flip: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14.5 3.5V8H19"/></svg>',
    thumbs: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="6.5" height="18" rx="1"/><rect x="13.5" y="3" width="6.5" height="18" rx="1"/></svg>',
    live: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>',
    sequence: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="8" width="5" height="8"/><rect x="10" y="8" width="5" height="8"/><rect x="17" y="8" width="5" height="8"/></svg>',
    spine: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v18M12 7h6M12 12h6M12 17h6"/></svg>',
    trace: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="17" r="1.4"/><circle cx="12" cy="7" r="1.4"/><circle cx="19" cy="14" r="1.4"/><path d="M5 17l7-10 7 7"/></svg>',
    playback: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16"/><path d="M10 9l6 3-6 3z"/></svg>',
    index: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="6" height="18"/><rect x="14" y="3" width="6" height="18"/></svg>',
    seed: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="14" rx="4.2" ry="5"/></svg>',
    leaf: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20V9"/><path d="M12 13c-4-1-5-5-4-7 4 0 5 4 4 7z"/><path d="M12 11c4-1 6-4 5-7-4 .2-6 4-5 7z"/></svg>',
    pen: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 4l6 6-9.5 9.5H4.5V13z"/></svg>',
    note: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="15" rx="4" ry="4.5"/><path d="M12 11V5"/></svg>',
    write: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 19l2-.4L17 8.5 14.5 6 4.5 16z"/><path d="M12 14c2-3 4-4 6-4"/></svg>',
    place: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M12 14c2-2 3-3 4-3"/></svg>',
    card: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="12" rx="1.4"/></svg>',
    ink: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
    wide: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="6" width="19" height="12" rx="1.2"/></svg>',
    tall: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="2.5" width="10" height="19" rx="1.2"/></svg>',
    deck: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 8h12M6 11h12"/><rect x="4" y="13.5" width="13" height="6" rx="1"/></svg>'
  };
  I.live = I.open; I.sequence = I.storyboard; I.spine = I.outline; I.trace = I.walk; I.playback = I.flip; I.index = I.thumbs;
  var STEPS = [
    { t: 'Hook', q: 'What starts this story?', s: 'kindled' },
    { t: 'Inciting incident', q: 'What knocks the ordinary world off balance?', s: 'lit' },
    { t: 'First threshold', q: 'What commits them, past the point of no return?', s: 'kindled' },
    { t: 'Complications', q: 'What keeps getting harder, and why can\u2019t they just walk away?', s: 'now' },
    { t: 'Midpoint', q: 'What do they learn here that changes the goal?', s: 'empty' },
    { t: 'Darkest point', q: 'What does defeat look like here?', s: 'empty' },
    { t: 'Climax', q: 'What is actually being decided?', s: 'empty' },
    { t: 'Resolution', q: 'What settles, and what is different now?', s: 'empty' },
    { t: 'Final image', q: 'How has the world changed?', s: 'empty' }
  ];
  var ACTS = [['Act I', [0, 1, 2]], ['Act II', [3, 4, 5]], ['Act III', [6, 7, 8]]];
  var PAGES = [
    ['Morning', 'Morning took the heat out of the stones before we started.'],
    ['The rope', 'The rope was already there when we reached the stone. We left the map and walked until the light went thin.'],
    ['The map', 'We left the map on the stone, face down, so the wind would not read it.'],
    ['The well', 'The bucket came up colder than the morning, and nobody spoke.'],
    ['The light', 'We walked until the light went thin and the path forgot its name.'],
    ['After', 'Whatever is worth carrying is already with you.']
  ];
  var POS = [[4, 5], [36, 8], [66, 4], [7, 36], [38, 34], [67, 38], [5, 67], [37, 66], [66, 68]];
  var GAPS = flux
    ? 'NO SIGNAL: Midpoint, Darkest point, Climax, Resolution, Final image'
    : 'Nothing yet: Midpoint, Darkest point, Climax, Resolution, Final image';

  function showAs(kind, open, current) {
    var items = flux
      ? (kind === 'book' ? [['playback', 'Playback'], ['index', 'Index']] : [['live', 'Live'], ['sequence', 'Sequence'], ['spine', 'Spine'], ['trace', 'Trace']])
      : (kind === 'book' ? [['flip', 'Flip'], ['thumbs', 'Thumbnails']] : [['open', 'Open'], ['storyboard', 'Storyboard'], ['outline', 'Outline'], ['walk', 'Walk']]);
    var label = flux ? 'Render' : 'Show as';
    if (!open) {
      var cur = items.filter(function (it) { return it[0] === current; })[0] || items[0];
      return '<div class="showas"><button class="showas-btn" type="button" title="' + label + '">' + I[cur[0]] + '</button></div>';
    }
    return '<div class="showas"><span class="showas-name">' + label + '</span><div class="showas-row">' + items.map(function (it) {
      return '<button type="button" class="' + (it[0] === current ? 'on' : '') + '">' + I[it[0]] + '<span>' + it[1] + '</span></button>';
    }).join('') + '</div></div>';
  }
  function askBtn(open) {
    var pop = '';
    if (open) {
      pop = '<aside class="pophelp"><p>The stretch where each try makes the next one harder.</p><em>Each time they haul the bucket, the rope comes back shorter.</em><button class="more" type="button">more \u2192 ' + (flux ? 'Operator' : 'Tutor') + '</button></aside>';
    }
    return '<span class="askwrap"><button class="ask' + (open ? ' on' : '') + '" type="button" aria-label="About this step">?</button>' + pop + '</span>';
  }
  function marks() {
    if (flux) {
      return '<div class="ticks">' + STEPS.map(function (s) { return '<i class="tick ' + s.s + '"></i>'; }).join('') + '</div>';
    }
    return '<div class="marks">' + STEPS.map(function (s, i) {
      var icon = (s.s === 'kindled' || s.s === 'lit') ? I.leaf : I.seed;
      var cap = i === 0 ? '<small>Start Here</small>' : '';
      return '<div class="mark ' + s.s + '"><span class="glyph">' + icon + '</span>' + cap + '</div>';
    }).join('') + '</div>';
  }
  function doors() {
    if (flux) {
      return '<div class="doors"><button type="button" class="on">[NOTE]</button><button type="button">[BOOT DOC]</button><button type="button">[INPUT DOC]</button><button type="button">[?]</button></div>';
    }
    return '<div class="doors"><button type="button" class="on">' + I.note + '<span>Notes</span></button><button type="button">' + I.write + '<span>Write this</span></button><button type="button">' + I.place + '<span>Place a page\u2026</span></button></div>';
  }
  function card(i, choice, help) {
    var s = STEPS[i];
    var read = flux ? '<div class="readout">TRK 4/9</div>' : '';
    var bars = flux ? '<i class="brackets"></i><i class="obar"></i>' : '';
    var body = flux
      ? '<p class="q">&gt; ' + s.q + ' <i class="caret"></i></p>'
      : '<p class="q">' + s.q + '</p>';
    return '<article class="card' + (choice ? ' choice' : '') + '">' + bars + read + '<h1>' + s.t + ' ' + askBtn(help) + '</h1>' + body + '</article>';
  }
  function unders() { return flux ? '' : '<i class="under a"></i><i class="under b"></i>'; }
  function deckHead() {
    if (flux) {
      return '<div class="deckhead"><div class="walk-name">STACK \u00b7 THREE-ACT \u00b7 4/9</div><div class="walk-name">Trace</div><div class="gaps">' + GAPS + '</div></div>';
    }
    return '<div class="deckhead"><div class="walk-name">Walk</div></div>';
  }

  var stage = '';
  var show = '';
  var gaps = '';
  var where = 'Three-Act';
  if (frame === 'listing') {
    where = 'The well';
    var rows = [
      ['<i class="wide"></i>', 'The second well', ''],
      ['<span class="stack"><i></i><i></i><i></i></span>', 'Three-Act', '<em>4 of 9</em>'],
      ['<i class="tallth"></i>', 'Journal', '']
    ];
    document.getElementById('pop').innerHTML = '<h2>' + (flux ? 'Circuits' : 'Boards') + '</h2>' + rows.map(function (r) {
      return '<button class="brow" type="button">' + r[0] + '<span><b>' + r[1] + '</b>' + r[2] + '</span></button>';
    }).join('');
    document.getElementById('rail').innerHTML = '<div class="place">The well</div><button type="button">' + (flux ? 'Docs' : 'Pages') + '</button><button type="button" class="on">' + (flux ? 'Circuits' : 'Boards') + '</button><button type="button">' + (flux ? 'Log' : 'Journal') + '</button>';
  } else if (frame === 'walk' || frame === 'walk-open' || frame === 'help') {
    show = showAs('deck', frame === 'walk-open', flux ? 'trace' : 'walk');
    gaps = flux ? '' : GAPS;
    stage = '<div class="walk">' + deckHead() + '<div class="walkrow"><button class="edge" type="button">Previous</button><div class="stackwrap">' + unders() + card(3, true, frame === 'help') + '</div><button class="edge" type="button">Next</button></div>' + doors() + marks() + '</div>';
  } else if (frame === 'open') {
    show = showAs('deck', false, flux ? 'live' : 'open');
    gaps = GAPS;
    stage = '<div class="table">' + STEPS.map(function (s, i) {
      var p = POS[i];
      return '<article class="tcard" style="left:' + p[0] + '%;top:' + p[1] + '%"><strong>' + s.t + '</strong><p class="q">' + s.q + '</p></article>';
    }).join('') + '</div>';
  } else if (frame === 'storyboard') {
    show = showAs('deck', false, flux ? 'sequence' : 'storyboard');
    gaps = GAPS;
    stage = '<div class="lanes">' + ACTS.map(function (act) {
      return '<section class="lane"><h3>' + act[0] + '</h3>' + act[1].map(function (i) {
        var s = STEPS[i];
        return '<article class="lcard"><strong>' + s.t + '</strong><p class="q">' + s.q + '</p></article>';
      }).join('') + '</section>';
    }).join('') + '</div>';
  } else if (frame === 'flip') {
    show = showAs('book', false, flux ? 'playback' : 'flip');
    where = 'Journal';
    var page = PAGES[1];
    stage = '<div class="flip"><button class="turn" type="button">\u2039</button><article class="sheet"><h1>' + page[0] + '</h1><p>' + page[1] + '</p><span class="num">2</span></article><button class="turn" type="button">\u203a</button></div>';
  } else if (frame === 'thumbs') {
    show = showAs('book', true, flux ? 'index' : 'thumbs');
    where = 'Journal';
    stage = '<div class="thumbs">' + PAGES.map(function (p, i) {
      return '<article class="pthumb' + (i === 1 ? ' on' : '') + '"><b>' + p[0] + '</b></article>';
    }).join('') + '</div>';
  } else if (frame === 'doors') {
    where = 'The well';
    stage = '<div class="story">'
      + '<article><div class="door-name">' + I.wide + '<span>New Board</span></div><div class="mini"><div class="mini-as">' + I.open + '</div><i class="ghost a"></i><i class="ghost b"></i><i class="ghost c"></i></div></article>'
      + '<article><div class="door-name">' + I.deck + '<span>Three-Act</span></div><div class="mini"><div class="mini-card"><b>Hook</b><p class="q">What starts this story?</p></div><div class="marks"><div class="mark now"><span class="glyph">' + I.seed + '</span><small>Start Here</small></div>' + STEPS.slice(1).map(function () { return '<div class="mark"><span class="glyph">' + I.seed + '</span></div>'; }).join('') + '</div></div></article>'
      + '<article><div class="door-name">' + I.tall + '<span>New Journal</span></div><div class="mini"><div class="mini-flip"><span class="turn">\u2039</span><div class="mini-page"><i></i></div><span class="turn">\u203a</span></div></div></article>'
      + '</div>';
  } else if (frame === 'phone') {
    stage = '<div class="walk">' + deckHead() + '<div class="swipe"><div class="stackwrap">' + unders() + card(3, true, false) + '</div><article class="card peek"><h1>Midpoint</h1><p class="q">What do they learn here that changes the goal?</p></article></div>' + doors() + marks() + '</div>';
  } else if (frame === 'ask' || frame === 'ask-result') {
    where = 'Presets';
    var inner = frame === 'ask'
      ? '<div class="icats"><article class="icat"><b>What are you making?</b><p>A novel</p></article><article class="icat on"><b>What carries it?</b><p>One person <i class="caret"></i></p></article><article class="icat"><b>How much do you want to know before you start?</b></article></div>'
      : '<article class="catalog"><div class="stamp">The librarian\u2019s pick</div><h3>Three-Act Structure</h3><p>A person and a turn, and you asked for the shape before the details.</p><p class="or">or: Story Circle</p><div class="browse">Browse the shelves</div></article>';
    stage = '<div class="presets"><h2>Presets</h2><div class="drawer"><div class="lip"></div>' + inner + '</div><div class="shelves"><div class="shelf">Three-Act</div><div class="shelf">Story Circle</div><div class="shelf">Character Study</div></div></div>';
  } else if (frame === 'diag') {
    where = flux ? 'Stacks' : 'Presets';
    stage = '<div class="term"><i class="brackets"></i><h2>DIAGNOSTIC v1</h2>'
      + '<div>&gt; WHAT ARE YOU MAKING? <span class="ans">[A NOVEL]</span></div>'
      + '<div>&gt; WHAT CARRIES IT? <span class="ans">[ONE PERSON]</span></div>'
      + '<div>&gt; HOW MUCH BEFORE YOU START? <span class="ans">[THE SHAPE]</span></div>'
      + '<div class="bar"><i></i><i></i><i></i></div>'
      + '<div class="hit">RESULT: THREE-ACT .... [LOAD]</div>'
      + '<div>ALT: STORY CIRCLE .... [LOAD]</div>'
      + '<div class="dim">BROWSE ALL STACKS</div></div>';
  }

  document.getElementById('stage').innerHTML = stage;
  document.getElementById('showslot').innerHTML = show;
  document.getElementById('brand').textContent = flux ? 'Flux' : 'Arbor';
  document.getElementById('where').textContent = where;
  document.getElementById('gaps').textContent = gaps;
  var modes = flux ? ['Wire In', 'Text', 'Patch', 'Uplink', 'Circuits'] : ['Free Write', 'Draft', 'Revise', 'Publish', 'Boards'];
  var onMode = flux ? 'Circuits' : 'Boards';
  document.getElementById('modes').innerHTML = modes.map(function (n) {
    return '<span' + (n === onMode ? ' class="on"' : '') + '>' + n + '</span>';
  }).join('');
  document.getElementById('tools').innerHTML = '<h2>Tools</h2><button class="tool" type="button">' + I.pen + ' Pen</button><button class="tool" type="button">' + I.card + ' Card</button><button class="tool" type="button">' + I.ink + ' Ink</button>';
  document.getElementById('side').innerHTML = '<h2>' + (flux ? 'Operator' : 'Tutor') + '</h2><h2 class="gap">Grafts</h2><button class="graft" type="button">The rope</button><button class="graft" type="button">The map</button>';
})();
</script>
