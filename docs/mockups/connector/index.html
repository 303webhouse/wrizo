<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrizo · Connector mockup</title>
<!--
  docs/mockups/connector — Nick's redesign of linking cards.
  No green tack. Select a card: outline + corner resize square (as today).
  Double-click or right-click the square: connection mode. The square morphs to a
  circle; a brass arm follows the pointer. Dragging over another card, or a page /
  card / board in the side drawer, activates it and reveals its circle: open if the
  two aren't connected, solid orange if they are. Release on a target: connect (both
  circles fill solid, a line flashes then goes). Esc, or release on nothing: cancel.
  Lines are hidden by default. In connection mode only, lines run from the active card to its
  connections on this board; never to drawer items. Releasing on an already-connected item
  disconnects it (its circle goes open). Drag a drawer row onto the board: a copy card lands
  there, already connected to its original. Two more removals: the right drawer's Grafts tab (Flux:
  Links) lists the selected card's connected thumbnails, each with an X that opens a confirm
  dialog; and in connection mode a click selects a line and Delete removes it.
  Hold the button through the drag (right-click-drag), or release near the square to
  latch the mode and finish with a click. Seeded: Opening scene <-> Who knows what
  and Harbor notes, Harbor notes <-> Chapter 1 (a drawer link, never drawn). Arbor / Flux, Reset: mockup only.
  Branch: cursor/connector.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Rajdhani:wght@400;500;600&family=Chakra+Petch:wght@400;500&display=swap');

  :root {
    --ink-950: #110600; --ink-900: #1F1A16; --ink-800: #2A241E;
    --ink-border: #332C25; --ink-border-strong: #453B31;
    --text-hi: #EDE6DA; --text-mid: #B5A998; --text-low: #80766A;
    --ink-on-paper: #2B2014; --ink-on-paper-low: #8A7C68;
    --paper: #F3EDE1; --card-stock: #FFFDF6; --card-hairline: #D9CFB6;
    --brass: #ff9800; --brass-press: #e88900; --accent-rest: #96a05a; --accent-door: #4F5730;
    --desk-ground: #1F1A16;
    --font-ui: 'Figtree', system-ui, sans-serif;
    --font-prose: 'Crimson Pro', Georgia, serif;
    --font-label: 'Figtree', system-ui, sans-serif;
    --sb: color-mix(in srgb, var(--text-low) 28%, transparent);
    --glide: .18s;
  }
  html[data-theme='flux'] {
    --ink-950: #04141A; --ink-900: #091E24; --ink-800: #0C2A32;
    --ink-border: #1D4A52; --ink-border-strong: #2A6A76;
    --text-hi: #E3F1EC; --text-mid: #8FB4AC; --text-low: #6E958D;
    --paper: #EDF6F3; --ink-on-paper: #0E2A30; --ink-on-paper-low: #4A7580;
    --card-stock: #FFFFFF; --card-hairline: #BFD6D1;
    --accent-rest: #5E837C; --accent-door: #4F5730;
    --desk-ground: #07161B;
    --font-ui: 'Rajdhani', system-ui, sans-serif;
    --font-label: 'Chakra Petch', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; scrollbar-width: thin; scrollbar-color: var(--sb) transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--desk-ground); color: var(--text-hi); font-family: var(--font-ui); user-select: none; }
  body[data-mode='true'], body[data-mode='true'] * { cursor: crosshair !important; }

  .rig {
    position: fixed; inset: 0 0 auto 0; z-index: 60;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 7px 12px; background: #000; border-bottom: 1px solid #222;
    font-size: 11px; color: #9a9a9a;
  }
  .rig b { color: #d8d8d8; letter-spacing: .06em; }
  .only { color: #6e6e6e; letter-spacing: .12em; text-transform: uppercase; font-size: 9px; border: 1px solid #333; padding: 2px 6px; }
  .rev { height: 22px; padding: 0 8px; border: 1px solid #333; color: #c8c8c8; background: #141414; font: inherit; cursor: pointer; }
  .rev[data-on='true'] { border-color: var(--accent-rest); color: var(--accent-rest); }
  .hint { margin-left: auto; color: #6a6a6a; }

  .room { position: absolute; inset: 42px 0 0 0; padding: 18px 28px 22px; display: flex; gap: 0; justify-content: center; }
  .board {
    position: relative; flex: 1 1 auto; max-width: 960px; height: 100%;
    background: var(--paper); border: 1px solid var(--ink-border);
    overflow: hidden; touch-action: none;
  }

  /* cards */
  .card {
    position: absolute; z-index: 3;
    background: var(--card-stock); color: var(--ink-on-paper);
    border: 1px solid var(--card-hairline);
    padding: 10px 12px; width: 210px; height: 118px;
  }
  .card .kind { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-on-paper-low); margin-bottom: 6px; }
  .card .txt { font-family: var(--font-prose); font-size: 15px; line-height: 1.4; overflow: hidden; max-height: calc(100% - 20px); }
  .card[data-selected='true'] { outline: 1.5px solid var(--brass); outline-offset: 0; z-index: 4; }
  .card[data-target='true'] { outline: 1.5px solid var(--brass); outline-offset: 0; z-index: 4; box-shadow: 0 6px 20px rgba(43,32,20,.18); }

  /* the corner resize square — as today; morphs to a circle in connection mode */
  .handle {
    position: absolute; right: -7px; bottom: -7px; width: 12px; height: 12px;
    background: var(--paper); border: 1.5px solid var(--brass);
    display: none; cursor: nwse-resize; z-index: 6;
    transition: border-radius var(--glide) ease, width var(--glide) ease, height var(--glide) ease, right var(--glide) ease, bottom var(--glide) ease, background-color var(--glide) ease;
  }
  .card[data-selected='true'] .handle { display: block; }
  .handle.is-circle { border-radius: 50%; width: 10px; height: 10px; right: -6px; bottom: -6px; }
  .handle.is-solid { background: var(--brass); }

  /* target circle: revealed on an active target */
  .tcircle {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: var(--paper); border: 1.5px solid var(--brass);
    display: none; z-index: 6; pointer-events: none;
  }
  .tcircle.is-solid { background: var(--brass); }
  .card .tcircle { right: -6px; bottom: -6px; }
  [data-target='true'] > .tcircle, [data-flash='true'] > .tcircle { display: block; }
  [data-peer='true'] > .tcircle { display: block; }
  .dragghost { position: fixed; z-index: 70; pointer-events: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--desk-ground); border: 1px solid var(--brass); color: var(--text-hi); font-family: var(--font-label); font-size: 13px; opacity: .92; }
  body[data-drag='true'], body[data-drag='true'] * { cursor: grabbing !important; }

  /* the side drawer (mock list) */
  .drawer {
    flex: 0 0 252px; height: 100%; background: var(--desk-ground);
    border: 1px solid var(--ink-border); border-left: none;
    display: flex; flex-direction: column; min-height: 0;
  }
  .dtabs { display: flex; border-bottom: 1px solid var(--ink-border); }
  .dtab { padding: 12px 14px 8px; font: inherit; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-low); background: none; border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px; cursor: pointer; }
  .dtab:hover { color: var(--text-hi); }
  .dtab[data-on='true'] { color: var(--accent-rest); border-bottom-color: var(--accent-rest); }
  .dlist[hidden] { display: none; }
  .gitem { position: relative; display: flex; align-items: center; gap: 10px; height: 52px; margin: 8px 8px 0; padding: 0 34px 0 12px; border: 1px solid var(--ink-border); color: var(--text-mid); font-family: var(--font-label); font-size: 13px; }
  .gx { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; color: var(--text-mid); background: none; border: 1px solid var(--ink-border-strong); cursor: pointer; }
  .gx:hover, .gx:focus-visible { color: var(--brass); border-color: var(--brass); outline: none; }
  .gnone { padding: 16px 14px; font-size: 12px; color: var(--text-low); }
  .scrim { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  .scrim[hidden] { display: none; }
  .dialog { background: var(--desk-ground); border: 1px solid var(--ink-border-strong); padding: 20px 22px 16px; min-width: 260px; }
  .dtitle { font-size: 15px; color: var(--text-hi); margin-bottom: 18px; font-family: var(--font-label); }
  .dbtns { display: flex; justify-content: flex-end; gap: 8px; }
  .dbtn { font: inherit; font-size: 12px; padding: 5px 14px; color: var(--text-mid); background: none; border: 1px solid var(--ink-border-strong); cursor: pointer; }
  .dbtn:hover, .dbtn:focus-visible { color: var(--text-hi); border-color: var(--text-mid); outline: none; }
  .dbtn.go { color: var(--brass); border-color: var(--brass); }
  .dbtn.go:hover, .dbtn.go:focus-visible { background: color-mix(in srgb, var(--brass) 14%, transparent); color: var(--brass); border-color: var(--brass); }
  .dlist { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .dsec { padding: 14px 14px 6px; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-low); }
  .drow {
    position: relative; display: flex; align-items: center; gap: 10px;
    height: 46px; margin: 0 8px; padding: 0 12px 0 22px; color: var(--text-mid);
    border: 1px solid transparent; font-family: var(--font-label); font-size: 13px;
  }
  .drow[data-target='true'] { border-color: var(--brass); color: var(--text-hi); background: color-mix(in srgb, var(--brass) 8%, transparent); }
  .drow .tcircle { left: 2px; top: 50%; margin-top: -5px; background: var(--desk-ground); }
  .drow .tcircle.is-solid { background: var(--brass); }
  .thumb { flex: 0 0 auto; background: var(--ink-800); border: 1px solid var(--ink-border-strong); position: relative; }
  .thumb.page { width: 24px; height: 32px; }
  .thumb.page::before { content: ''; position: absolute; inset: 5px 4px; background:
      repeating-linear-gradient(to bottom, var(--text-low) 0 1px, transparent 1px 4px); opacity: .7; }
  .thumb.card { width: 34px; height: 24px; background: var(--card-stock); border-color: var(--card-hairline); }
  .thumb.card::before { content: ''; position: absolute; inset: 5px 5px; background:
      repeating-linear-gradient(to bottom, var(--ink-on-paper-low) 0 1px, transparent 1px 4px); opacity: .6; }
  .thumb.board { width: 34px; height: 24px; background: var(--paper); border-color: var(--card-hairline); }
  .thumb.board::before, .thumb.board::after { content: ''; position: absolute; background: var(--card-stock); border: 1px solid var(--card-hairline); }
  .thumb.board::before { left: 3px; top: 3px; width: 11px; height: 8px; }
  .thumb.board::after { right: 3px; bottom: 3px; width: 13px; height: 9px; }
  .dlabel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* overlay: lines + the arm */
  #wires { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; overflow: visible; }
  #wires .line { stroke: var(--brass); stroke-width: 1; fill: none; stroke-linecap: round; opacity: .9; }
  #wires .arm { stroke: var(--brass); stroke-width: 2.5; fill: none; stroke-linecap: round; }
  #wires .tip { fill: var(--brass); }
  #wires .hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
  #wires .line.is-sel { stroke-width: 2.5; opacity: 1; }

  @media (prefers-reduced-motion: reduce) { .handle { transition: none; } }
</style>
</head>
<body data-mode="false">
<header class="rig" id="rig">
  <b>CONNECTOR</b>
  <span class="only">mockup only</span>
  <button class="rev" data-theme="arbor" type="button">Arbor</button>
  <button class="rev" data-theme="flux" type="button">Flux</button>
  <button class="rev" id="reset" type="button">Reset</button>
  <span class="hint" id="hint">Select a card, then double-click or right-click its corner square.</span>
</header>

<div class="room">
  <div class="board" id="board"></div>
  <aside class="drawer" aria-label="Drawer">
    <div class="dtabs" role="tablist"><button class="dtab" data-tab="lib" id="tabLib" type="button">Drawer</button><button class="dtab" data-tab="graft" id="tabGraft" type="button">Grafts</button></div>
    <div class="dlist" id="dlist"></div>
    <div class="dlist" id="glist" hidden></div>
  </aside>
</div>
<svg id="wires" aria-hidden="true"></svg>
<div class="scrim" id="scrim" hidden><div class="dialog" role="alertdialog" aria-labelledby="dlgTitle"><div class="dtitle" id="dlgTitle">Remove graft?</div><div class="dbtns"><button class="dbtn" id="dlgNo" type="button">Cancel</button><button class="dbtn go" id="dlgYes" type="button">Remove</button></div></div></div>

<script>
(function () {
  const root = document.documentElement;
  const board = document.getElementById('board');
  const dlist = document.getElementById('dlist');
  const wires = document.getElementById('wires');
  const hint = document.getElementById('hint');
  const SVGNS = 'http://www.w3.org/2000/svg';
  const HINT_IDLE = 'Select a card, then double-click or right-click its corner square. Drag a drawer row onto the board to copy it.';

  const CARDS = [
    { id: 'c1', x: 54,  y: 56,  n: 'Opening scene', t: 'Opening scene. Ada reaches the harbor an hour before the ferry.' },
    { id: 'c2', x: 410, y: 70,  n: 'Harbor notes', t: 'Harbor notes: gulls, diesel, a locked ticket booth.' },
    { id: 'c3', x: 150, y: 270, n: 'Who knows what', t: 'Who knows what, and when they learn it.' },
    { id: 'c4', x: 500, y: 300, n: 'Timeline', t: 'Timeline: three days, one ferry, no phone.' }
  ];
  const SIDE = {
    arbor: { Pages: 'Pages', Cards: 'Cards', Boards: 'Boards' },
    flux: { Pages: 'Docs', Cards: 'Cards', Boards: 'Circuits' }
  };
  const DRAWER = [
    ['Pages', 'page', [['p1', 'Chapter 1'], ['p2', 'Chapter 2'], ['p3', 'Interview notes'], ['p4', 'Untitled']]],
    ['Cards', 'card', [['k1', 'Harbor map'], ['k2', 'Ada, age 34'], ['k3', 'Ferry schedule']]],
    ['Boards', 'board', [['b1', 'Plot board'], ['b2', 'Characters'], ['b3', 'Research']]]
  ];
  const SEED = [['c1', 'c3'], ['c1', 'c2'], ['c2', 'p1']];

  let conns = new Set();
  let cards = [];                // ids of the cards on this board
  let nextCopy = 1;
  let sel = null;                // selected card id
  let mode = null;               // { src, held, ox, oy, moved, px, py, target }
  let flash = null;              // { a, b, off, line }
  let selLine = null;            // key of the line selected in connection mode
  let tab = 'lib';               // right drawer: 'lib' | 'graft'
  let pendingRemove = null;      // [card, peer] awaiting the confirm dialog
  let flashTimer = 0, lineTimer = 0;
  const els = {};                // id -> element

  const key = (a, b) => [a, b].sort().join('|');
  const linked = (a, b) => conns.has(key(a, b));
  const isCard = (id) => cards.includes(id);
  const hasAny = (id) => peersOf(id).length > 0;
  const peersOf = (id) => [...conns].map((k) => k.split('|')).filter((p) => p.includes(id)).map((p) => (p[0] === id ? p[1] : p[0]));

  function addDots(el) { el.insertAdjacentHTML('beforeend', '<span class="tcircle"></span>'); }

  function makeCard(id, x, y, text, label) {
    const el = document.createElement('div');
    el.className = 'card'; el.dataset.id = id; el.dataset.label = label || text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = '<div class="kind">Card</div><div class="txt"></div><div class="handle"></div>';
    el.querySelector('.txt').textContent = text;
    addDots(el);
    board.append(el); els[id] = el; cards.push(id);
    return el;
  }

  function side() { return root.getAttribute('data-theme') === 'flux' ? 'flux' : 'arbor'; }

  function build() {
    board.innerHTML = ''; cards = [];
    Object.keys(els).forEach((k) => delete els[k]);
    CARDS.forEach((c) => makeCard(c.id, c.x, c.y, c.t, c.n));
    dlist.innerHTML = '';
    DRAWER.forEach(([sec, kind, rows]) => {
      const h = document.createElement('div'); h.className = 'dsec'; h.dataset.sec = sec; dlist.append(h);
      rows.forEach(([id, label]) => {
        const r = document.createElement('div');
        r.className = 'drow'; r.dataset.id = id; r.dataset.kind = kind; r.dataset.label = label;
        r.innerHTML = '<span class="thumb ' + kind + '"></span><span class="dlabel">' + label + '</span>';
        addDots(r);
        dlist.append(r); els[id] = r;
      });
    });
    relabel();
  }

  function relabel() {
    dlist.querySelectorAll('.dsec').forEach((h) => { h.textContent = SIDE[side()][h.dataset.sec]; });
    document.getElementById('tabLib').textContent = side() === 'flux' ? 'Rack' : 'Drawer';
    document.getElementById('tabGraft').textContent = side() === 'flux' ? 'Links' : 'Grafts';
    document.getElementById('dlgTitle').textContent = side() === 'flux' ? 'Remove link?' : 'Remove graft?';
  }

  /* ---- state -> DOM ---- */
  function sync() {
    document.body.dataset.mode = mode ? 'true' : 'false';
    const peers = mode ? peersOf(mode.src).filter(isCard) : [];
    Object.keys(els).forEach((id) => {
      const el = els[id];
      const isTarget = !!(mode && mode.target === id);
      const isPeer = peers.includes(id);
      const isFlashB = !!(flash && flash.b === id);
      el.dataset.target = isTarget ? 'true' : 'false';
      el.dataset.peer = isPeer ? 'true' : 'false';
      el.dataset.flash = isFlashB ? 'true' : 'false';
      // connected circles are always solid orange; open means not connected
      let solid = false;
      if (isTarget) solid = linked(mode.src, id);
      if (isPeer) solid = true;
      if (isFlashB) solid = flash.off ? hasAny(id) : true;
      el.querySelector(':scope > .tcircle').classList.toggle('is-solid', solid);
    });
    cards.forEach((id) => {
      const el = els[id];
      el.dataset.selected = sel === id ? 'true' : 'false';
      const h = el.querySelector('.handle');
      const inMode = !!(mode && mode.src === id);
      const inFlash = !!(flash && flash.a === id);
      h.classList.toggle('is-circle', inMode || inFlash);
      h.classList.toggle('is-solid', (inMode && !!mode.target && linked(mode.src, mode.target)) || (inFlash && (flash.off ? hasAny(id) : true)));
    });
    renderTabs(); renderGrafts();
    render();
  }

  function anchorOf(id) {
    const el = els[id]; if (!el) return null;
    const r = el.getBoundingClientRect();
    if (el.classList.contains('drow')) return { x: r.left + 1 + 2 + 5, y: r.top + r.height / 2 };   // centre of the row's open circle
    return { x: r.right, y: r.bottom };
  }

  function line(a, b, cls, parent) {
    const l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('class', cls);
    l.setAttribute('x1', a.x); l.setAttribute('y1', a.y); l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
    (parent || wires).append(l);
    return l;
  }

  /* lines are hidden by default. Only: (1) connection mode, active card -> its on-board
     connections; (2) a brief flash just after connecting two on-board cards.
     Never a line to a drawer item or anything off this board. */
  function render() {
    wires.innerHTML = '';
    // card-to-card lines (and their click targets) live in a group clipped to the board's
    // visible rectangle, so they are never drawn over the rail. The arm is NOT clipped.
    const br = board.getBoundingClientRect();
    wires.insertAdjacentHTML('afterbegin', '<defs><clipPath id="boardClip"><rect x="' + br.left + '" y="' + br.top + '" width="' + br.width + '" height="' + br.height + '"/></clipPath></defs>');
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('clip-path', 'url(#boardClip)');
    wires.append(g);
    if (mode) {
      const from = anchorOf(mode.src);
      peersOf(mode.src).filter(isCard).forEach((id) => {
        const to2 = anchorOf(id), k = key(mode.src, id), on = selLine === k;
        line(from, to2, on ? 'line is-sel' : 'line', g);
        line(from, to2, 'hit', g).dataset.key = k;
      });
      // pointer over a drawer row already linked to the active card: no arm, no tip, only
      // that row's solid circle. The arm returns when the pointer leaves.
      const tg = mode.target;
      const onLinkedRow = !!tg && !isCard(tg) && linked(mode.src, tg);
      if (!onLinkedRow) {
        let to = { x: mode.px, y: mode.py };
        if (tg) to = anchorOf(tg);
        line(from, to, 'arm');
        if (!tg) {
          const tip = document.createElementNS(SVGNS, 'circle');
          tip.setAttribute('class', 'tip'); tip.setAttribute('cx', to.x); tip.setAttribute('cy', to.y); tip.setAttribute('r', 3.5);
          wires.append(tip);
        }
      }
    } else if (flash && flash.line && !flash.off && isCard(flash.a) && isCard(flash.b)) {
      line(anchorOf(flash.a), anchorOf(flash.b), 'line', g);
    }
  }

  /* ---- connection mode ---- */
  function enterMode(srcId, held, e) {
    selLine = null;
    mode = { src: srcId, held, ox: e.clientX, oy: e.clientY, moved: false, px: e.clientX, py: e.clientY, target: null };
    clearFlash();
    hint.textContent = 'Drag onto a card or drawer row. Release to connect; on a connected one, to disconnect. Esc cancels.';
    sync();
  }
  function endMode() { mode = null; selLine = null; hint.textContent = HINT_IDLE; sync(); }
  function targetAt(x, y) {
    for (const el of document.elementsFromPoint(x, y)) {
      if (el.closest('#wires')) continue;
      const row = el.closest('.drow'); if (row) return row.dataset.id;
      const c = el.closest('.card'); if (c && c.dataset.id !== mode.src) return c.dataset.id;
    }
    return null;
  }
  function clearFlash() { clearTimeout(flashTimer); clearTimeout(lineTimer); flash = null; }
  function startFlash(f, keep) {
    clearFlash();
    flash = f;
    if (keep) return;
    lineTimer = setTimeout(() => { if (flash) { flash.line = false; render(); } }, 650);
    flashTimer = setTimeout(() => { flash = null; sync(); }, 1500);
  }
  function commit(tid) {
    const src = mode.src, k = key(src, tid);
    const off = conns.has(k);
    if (off) conns.delete(k); else conns.add(k);
    endMode();
    startFlash({ a: src, b: tid, off, line: true });
    sync();
  }

  document.addEventListener('mousemove', (e) => {
    if (!mode) return;
    mode.px = e.clientX; mode.py = e.clientY;
    if (Math.hypot(e.clientX - mode.ox, e.clientY - mode.oy) > 6) mode.moved = true;
    mode.target = targetAt(e.clientX, e.clientY);
    sync();
  });

  document.addEventListener('mouseup', (e) => {
    if (!mode) return;
    const hit = document.elementsFromPoint(e.clientX, e.clientY).find((n) => n.classList && n.classList.contains('hit'));
    if (hit) {                                   // a click on a line selects it; Delete removes it
      mode.held = false; selLine = hit.dataset.key; mode.target = null; sync(); return;
    }
    const t = targetAt(e.clientX, e.clientY);
    if (mode.held) {
      mode.held = false;
      if (t) { commit(t); return; }
      if (mode.moved) { endMode(); return; }   // released on nothing after a drag: cancel
      return;                                    // released at the square: latch, finish with a click
    }
    if (t) commit(t); else endMode();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (!scrim.hidden) { closeDialog(); return; } if (mode) endMode(); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && mode && selLine) {
      e.preventDefault();
      const [a, b] = selLine.split('|'), peer = a === mode.src ? b : a;
      conns.delete(selLine); selLine = null;
      startFlash({ a: mode.src, b: peer, off: true, line: false });
      sync();
    }
  });
  document.addEventListener('contextmenu', (e) => { if (mode || e.target.closest('.handle')) e.preventDefault(); });

  /* ---- drawer row dragged onto the board: a copy card, already connected to its original ---- */
  function dropRow(rowId, x, y) {
    const br = board.getBoundingClientRect();
    const px = Math.max(0, Math.min(x - br.left - 105, br.width - 212));
    const py = Math.max(0, Math.min(y - br.top - 59, br.height - 120));
    const id = 'n' + (nextCopy++);
    makeCard(id, px, py, els[rowId].dataset.label);
    conns.add(key(id, rowId));
    sel = id;
    startFlash({ a: id, b: rowId, off: false, line: false });
    sync();
  }
  function startRowDrag(row, e) {
    const x0 = e.clientX, y0 = e.clientY;
    let ghost = null;
    const mv = (m) => {
      if (!ghost && Math.hypot(m.clientX - x0, m.clientY - y0) > 5) {
        ghost = document.createElement('div'); ghost.className = 'dragghost';
        ghost.innerHTML = '<span class="thumb ' + row.dataset.kind + '"></span><span>' + row.dataset.label + '</span>';
        document.body.append(ghost); document.body.dataset.drag = 'true';
      }
      if (ghost) { ghost.style.left = (m.clientX + 10) + 'px'; ghost.style.top = (m.clientY - 20) + 'px'; }
    };
    const up = (m) => {
      document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
      if (!ghost) return;
      ghost.remove(); delete document.body.dataset.drag;
      const hit = document.elementFromPoint(m.clientX, m.clientY);
      if (hit && hit.closest('#board')) dropRow(row.dataset.id, m.clientX, m.clientY);
    };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  }

  /* ---- right drawer: Grafts (Flux: Links), the selected card's connected thumbnails ---- */
  const glist = document.getElementById('glist');
  const scrim = document.getElementById('scrim');
  function renderTabs() {
    document.getElementById('tabLib').dataset.on = tab === 'lib' ? 'true' : 'false';
    document.getElementById('tabGraft').dataset.on = tab === 'graft' ? 'true' : 'false';
    dlist.hidden = tab !== 'lib'; glist.hidden = tab !== 'graft';
  }
  function renderGrafts() {
    glist.innerHTML = '';
    if (!sel) { glist.innerHTML = '<div class="gnone">Select a card</div>'; return; }
    const peers = peersOf(sel);
    if (!peers.length) { glist.innerHTML = '<div class="gnone">None</div>'; return; }
    peers.forEach((id) => {
      const el = els[id], kind = isCard(id) ? 'card' : el.dataset.kind;
      const row = document.createElement('div'); row.className = 'gitem'; row.dataset.id = id;
      row.innerHTML = '<span class="thumb ' + kind + '"></span><span class="dlabel"></span><button class="gx" type="button" aria-label="Remove">&times;</button>';
      row.querySelector('.dlabel').textContent = el.dataset.label;
      glist.append(row);
    });
  }
  glist.addEventListener('click', (e) => {
    const x = e.target.closest('.gx'); if (!x) return;
    pendingRemove = [sel, x.closest('.gitem').dataset.id];
    scrim.hidden = false; document.getElementById('dlgNo').focus();
  });
  function closeDialog() { scrim.hidden = true; pendingRemove = null; }
  document.getElementById('dlgNo').addEventListener('click', closeDialog);
  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) closeDialog(); });
  document.getElementById('dlgYes').addEventListener('click', () => {
    if (pendingRemove) {
      const [a, b] = pendingRemove;
      conns.delete(key(a, b));
      startFlash({ a, b, off: true, line: false });
    }
    closeDialog(); sync();
  });
  document.querySelectorAll('.dtab').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; sync(); }));

  /* ---- selection + resize ---- */
  document.addEventListener('mousedown', (e) => {
    if (e.target.closest('#rig') || e.target.closest('#scrim')) return;
    if (mode) { e.preventDefault(); return; }
    if (e.target.closest('.dtab') || e.target.closest('#glist')) return;
    const handle = e.target.closest('.handle');
    if (handle) {
      const card = handle.closest('.card');
      e.preventDefault(); e.stopPropagation();
      if (e.button === 2 || (e.button === 0 && e.detail >= 2)) { enterMode(card.dataset.id, true, e); return; }
      if (e.button !== 0) return;
      const w0 = card.offsetWidth, h0 = card.offsetHeight, x0 = e.clientX, y0 = e.clientY;
      const mv = (m) => {
        card.style.width = Math.max(130, w0 + m.clientX - x0) + 'px';
        card.style.height = Math.max(76, h0 + m.clientY - y0) + 'px';
        render();
      };
      const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      return;
    }
    const row = e.target.closest('.drow');
    if (row && e.button === 0) { e.preventDefault(); startRowDrag(row, e); return; }
    const card = e.target.closest('.card');
    if (card) { sel = card.dataset.id; sync(); return; }
    if (e.target.closest('#board')) { sel = null; sync(); }
  }, true);

  dlist.addEventListener('scroll', render);
  /* mockup only: in a narrow window, keep every card inside the board so none sit under the rail */
  function clampCards() {
    const bw = board.clientWidth, bh = board.clientHeight;
    cards.forEach((id) => {
      const el = els[id];
      const x = Math.max(0, Math.min(el.offsetLeft, bw - el.offsetWidth - 8));
      const y = Math.max(0, Math.min(el.offsetTop, bh - el.offsetHeight - 8));
      el.style.left = x + 'px'; el.style.top = y + 'px';
    });
  }
  window.addEventListener('resize', () => { clampCards(); render(); });

  /* ---- mockup chrome ---- */
  function syncRig() {
    document.querySelectorAll('.rev[data-theme]').forEach((b) => { b.dataset.on = b.dataset.theme === side() ? 'true' : 'false'; });
  }
  document.querySelectorAll('.rev[data-theme]').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.theme === 'flux') root.setAttribute('data-theme', 'flux'); else root.removeAttribute('data-theme');
    relabel(); syncRig(); sync();
  }));
  function reset() {
    clearFlash(); mode = null; sel = null; selLine = null; nextCopy = 1; tab = 'lib'; closeDialog();
    conns = new Set(SEED.map(([a, b]) => key(a, b)));
    build(); clampCards(); hint.textContent = HINT_IDLE; sync();
  }
  document.getElementById('reset').addEventListener('click', reset);

  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'flux') root.setAttribute('data-theme', 'flux');
  reset(); clampCards(); sync(); syncRig();

  /* ?demo=... sets a still for screenshots (mockup only) */
  const demo = q.get('demo');
  if (demo) setTimeout(() => {
    const at = (id) => { const r = els[id].getBoundingClientRect(); return { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }; };
    const src = demo === 'rowlinked' ? 'c2' : 'c1';
    sel = src;
    if (demo === 'select') { sync(); return; }
    if (demo === 'grafts' || demo === 'confirm') {
      tab = 'graft'; sync();
      if (demo === 'confirm') { const x = glist.querySelector('.gx'); pendingRemove = [sel, x.closest('.gitem').dataset.id]; scrim.hidden = false; }
      return;
    }
    if (demo === 'removed') {
      tab = 'graft'; conns.delete(key('c1', 'c3')); startFlash({ a: 'c1', b: 'c3', off: true, line: false }); clearTimeout(flashTimer); clearTimeout(lineTimer); sync(); return;
    }
    if (demo === 'drop') { const br = board.getBoundingClientRect(); dropRow('p3', br.left + 330, br.top + 400); clearTimeout(flashTimer); clearTimeout(lineTimer); return; }
    const ar = els[src].getBoundingClientRect();
    enterMode(src, false, { clientX: ar.right, clientY: ar.bottom });
    if (demo === 'none') { mode.px = ar.right + 130; mode.py = ar.bottom + 40; sync(); return; }
    if (demo === 'done') { commit('c4'); clearTimeout(flashTimer); clearTimeout(lineTimer); return; }
    if (demo === 'off') { commit('c3'); clearTimeout(flashTimer); clearTimeout(lineTimer); return; }
    if (demo === 'lineselect') { selLine = key('c1', 'c2'); mode.px = ar.right + 120; mode.py = ar.bottom + 60; sync(); return; }
    const tgt = { open: 'p2', linked: 'c2', card: 'c4', cardlinked: 'c3', menulinked: 'p1', rowlinked: 'p1' }[demo];
    const p = at(tgt); mode.px = p.clientX; mode.py = p.clientY; mode.target = tgt; sync();
  }, 150);
})();
</script>
</body>
</html>
