<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhizome sprout — mockup</title>
<!--
  The weed from cursor/rhizome-sprout, drawn so it can be watched.
  Same rules as store/rhizomeGrowth.ts: one sprout, shoots of uneven length,
  the kept shoot is the next clump's centre. Strokes under the page are hidden.
  ?frame=early|mid|full|next  — stills. prefers-reduced-motion does not autoplay.
-->
<style>
  :root { --ink: #8d7b58; --brass: #c4a15a; --ground: #16130f; --paper: #f4efe4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ground); color: #d9d0c2; font-family: Georgia, serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .rig { flex: 0 0 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #0c0a08; border-bottom: 1px solid #2a241c; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .06em; }
  html.shot .rig { display: none; }
  button { font: inherit; color: inherit; background: #1c1814; border: 1px solid #3a3228; padding: 4px 10px; cursor: pointer; }
  button[aria-pressed='true'] { border-color: var(--brass); color: var(--brass); }
  .rig .sp { margin-left: auto; color: #8a7d6a; }
  .stage { position: relative; flex: 1; min-height: 0; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .seg { stroke: var(--ink); stroke-width: 1px; stroke-linecap: round; fill: none; opacity: .85; }
  .seg.thick { stroke-width: 1px; opacity: 1; }
  .stage[data-flash='true'] .seg { stroke: var(--brass); opacity: 1; }
  .stage[data-flash='fading'] .seg { stroke: var(--brass); opacity: 0; transition: opacity 1.2s ease; }
  .paper { position: absolute; background: var(--paper); color: #2b2418; box-shadow: 0 18px 50px rgba(0,0,0,.45); padding: 64px 56px; overflow: hidden; }
  .paper h1 { font-weight: 500; font-size: 22px; letter-spacing: .04em; margin-bottom: 1.2em; }
  .paper p { font-size: 17px; line-height: 1.65; margin: 0 0 1em; }
  @media (prefers-reduced-motion: reduce) {
    .stage[data-flash='fading'] .seg { transition: none; }
  }
</style>
</head>
<body>
<header class="rig">
  <b>RHIZOME</b>
  <button type="button" id="play" aria-pressed="true">Growing</button>
  <button type="button" id="reset">Reset lap</button>
  <span id="read" class="sp"></span>
</header>
<div class="stage" id="stage">
  <svg id="field" aria-hidden="true"></svg>
  <div class="paper" id="paper">
    <h1>THE DIG</h1>
    <p>The kettle clicks off and she still doesn’t turn around. Steam writes a short sentence on the window, then forgets it.</p>
    <p>He could say her name. He doesn’t. The room keeps its own counsel, and the weed under the page does not ask to be finished.</p>
  </div>
</div>
<script>
(function () {
  var CELL = 28, STEP_MIN = 10, STEP_MAX = 22, MAX_TURN = 24 * Math.PI / 180, WANDER = 9 * Math.PI / 180;
  var SURVIVOR_STEPS = 7, SHOOTS = 7, SHORT_EXTRA = 12, MID_EXTRA = 28, LONG_EXTRA = 128, SPLIT_CHANCE = 0.07;
  var BRANCH_MIN = 35 * Math.PI / 180, BRANCH_MAX = 70 * Math.PI / 180, EDGE_PAD = 3, LAP_CAP = 4200;

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashSeed(input) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < input.length; i++) { h ^= input.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function gauss(rng) {
    var u = Math.max(rng(), 1e-9), v = rng();
    var g = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    return Math.max(-2.5, Math.min(2.5, g));
  }
  function angleDiff(a, b) {
    var d = b - a;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    return d;
  }
  function inRect(x, y, r) { return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }
  function isHidden(geo, x, y) { for (var i = 0; i < geo.hidden.length; i++) if (inRect(x, y, geo.hidden[i])) return true; return false; }
  function inStage(geo, x, y) { return x >= EDGE_PAD && y >= EDGE_PAD && x <= geo.width - EDGE_PAD && y <= geo.height - EDGE_PAD; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function planLap(geo, seed, start) {
    var rng = mulberry32(seed);
    var segments = [], nextId = 1, nextStem = 1;
    function push(x1, y1, x2, y2, order, stem, thick) {
      var visible = !(isHidden(geo, x1, y1) && isHidden(geo, x2, y2) && isHidden(geo, (x1 + x2) / 2, (y1 + y2) / 2));
      segments.push({ id: nextId++, x1: x1, y1: y1, x2: x2, y2: y2, order: order, stem: stem, thick: thick, visible: visible });
    }
    function clearSteps(x, y, angle) {
      var step = (STEP_MIN + STEP_MAX) / 2;
      for (var i = 1; i <= 80; i++) {
        var px = x + Math.cos(angle) * step * i, py = y + Math.sin(angle) * step * i;
        if (!inStage(geo, px, py)) return Math.max(1, i - 1);
        if (!isHidden(geo, px, py)) return i;
      }
      return 12;
    }
    var tips = [];
    function extraSteps() {
      var roll = rng();
      return roll < 0.28 ? SHORT_EXTRA + Math.floor(rng() * 4)
        : roll < 0.72 ? MID_EXTRA + Math.floor(rng() * 6)
        : LONG_EXTRA + Math.floor(rng() * 8);
    }
    function fan(x, y, order) {
      var base = rng() * Math.PI * 2;
      for (var i = 0; i < SHOOTS; i++) {
        var angle = base + (i * 2 * Math.PI) / SHOOTS + (rng() - 0.5) * 0.85;
        tips.push({ x: x, y: y, angle: angle, order: order, stem: nextStem++, left: clearSteps(x, y, angle) + extraSteps(), cx: x, cy: y });
      }
    }
    function fromStem(kept) {
      var last = kept[kept.length - 1];
      var heading = Math.atan2(last.y2 - last.y1, last.x2 - last.x1);
      tips.push({
        x: last.x2, y: last.y2, angle: heading, order: 0, stem: nextStem++,
        left: clearSteps(last.x2, last.y2, heading) + LONG_EXTRA + Math.floor(rng() * 8),
        cx: last.x1, cy: last.y1
      });
      for (var i = 1; i < SHOOTS; i++) {
        var s = kept[Math.floor(rng() * kept.length)];
        var a = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        var side = rng() < 0.5 ? -1 : 1;
        var turn = BRANCH_MIN + rng() * (BRANCH_MAX - BRANCH_MIN);
        tips.push({
          x: s.x2, y: s.y2, angle: a + side * turn, order: 1, stem: nextStem++,
          left: clearSteps(s.x2, s.y2, a + side * turn) + extraSteps(), cx: s.x1, cy: s.y1
        });
      }
    }
    if (start && start.length) {
      var stem = nextStem++;
      start.forEach(function (s) { push(s.x1, s.y1, s.x2, s.y2, 0, stem, true); });
      fromStem(start);
    } else {
      var ox = clamp(geo.origin.x, EDGE_PAD, geo.width - EDGE_PAD);
      var oy = clamp(geo.origin.y, EDGE_PAD, geo.height - EDGE_PAD);
      var a0 = rng() * Math.PI * 2;
      var len = STEP_MIN + rng() * (STEP_MAX - STEP_MIN);
      var x2 = clamp(ox + Math.cos(a0) * len, EDGE_PAD, geo.width - EDGE_PAD);
      var y2 = clamp(oy + Math.sin(a0) * len, EDGE_PAD, geo.height - EDGE_PAD);
      push(ox, oy, x2, y2, 0, nextStem++, true);
      fan(x2, y2, 0);
    }
    var firstCount = start && start.length ? start.length : 1;
    var guard = 0;
    while (tips.length && segments.length < LAP_CAP && guard++ < LAP_CAP * 4) {
      var ti = Math.floor(rng() * tips.length);
      var tip = tips[ti];
      var outward = Math.atan2(tip.y - tip.cy, tip.x - tip.cx);
      var angle = tip.angle;
      if (Math.hypot(tip.x - tip.cx, tip.y - tip.cy) > STEP_MAX) angle += clamp(angleDiff(angle, outward), -MAX_TURN, MAX_TURN) * 0.4;
      angle += gauss(rng) * WANDER;
      var slen = STEP_MIN + rng() * (STEP_MAX - STEP_MIN);
      var nx = tip.x + Math.cos(angle) * slen, ny = tip.y + Math.sin(angle) * slen;
      if (!inStage(geo, nx, ny)) { tips.splice(ti, 1); continue; }
      push(tip.x, tip.y, nx, ny, tip.order, tip.stem, tip.order === 0);
      tip.x = nx; tip.y = ny; tip.angle = angle; tip.left--;
      if (tip.order === 0 && tip.left > 3 && tips.length < SHOOTS + 6 && rng() < SPLIT_CHANCE) {
        var side = rng() < 0.5 ? -1 : 1;
        var turn = BRANCH_MIN + rng() * (BRANCH_MAX - BRANCH_MIN);
        tips.push({ x: nx, y: ny, angle: angle + side * turn, order: 1, stem: nextStem++, left: 3 + Math.floor(rng() * 5), cx: tip.cx, cy: tip.cy });
      }
      if (tip.left <= 0) tips.splice(tips.indexOf(tip), 1);
    }
    return { segments: segments, firstCount: firstCount };
  }

  function pickSurvivor(plan, seed) {
    var byStem = {};
    plan.segments.forEach(function (s) { (byStem[s.stem] = byStem[s.stem] || []).push(s); });
    var runs = [];
    Object.keys(byStem).forEach(function (k) {
      var run = [];
      byStem[k].forEach(function (s) {
        var joins = !run.length || (run[run.length - 1].x2 === s.x1 && run[run.length - 1].y2 === s.y1);
        if (s.visible && joins) run.push(s); else run = s.visible ? [s] : [];
        if (run.length === SURVIVOR_STEPS) { runs.push(run.slice()); run = []; }
      });
    });
    var rng = mulberry32(seed ^ 0x5bd1e995);
    var mains = runs.filter(function (r) { return r[0].order === 0; });
    var pool = mains.length ? mains : runs;
    if (!pool.length) {
      var vis = plan.segments.filter(function (s) { return s.visible; });
      if (!vis.length) return null;
      var one = vis[Math.floor(rng() * vis.length)];
      return [{ x1: one.x1, y1: one.y1, x2: one.x2, y2: one.y2, order: 0, thick: true, stem: 0, visible: true }];
    }
    return pool[Math.floor(rng() * pool.length)].map(function (s) {
      return { x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2, order: 0, thick: true, stem: s.stem, visible: true };
    });
  }

  var stage = document.getElementById('stage');
  var field = document.getElementById('field');
  var paper = document.getElementById('paper');
  var read = document.getElementById('read');
  var playBtn = document.getElementById('play');
  var frame = new URLSearchParams(location.search).get('frame');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (frame) document.documentElement.classList.add('shot');

  var lap = 0, frac = 0, playing = !reduced && !frame, flash = null;
  var FRAMES = { early: [0, 0.18], mid: [0, 0.55], full: [0, 1], next: [1, 0.45] };
  if (FRAMES[frame]) { lap = FRAMES[frame][0]; frac = FRAMES[frame][1]; }

  function layout() {
    var r = stage.getBoundingClientRect();
    var pw = Math.min(480, r.width * 0.38), ph = Math.min(560, r.height * 0.62);
    var left = (r.width - pw) / 2, top = (r.height - ph) / 2;
    paper.style.left = left + 'px'; paper.style.top = top + 'px';
    paper.style.width = pw + 'px'; paper.style.height = ph + 'px';
    return {
      width: r.width, height: r.height,
      hidden: [{ left: left, top: top, right: left + pw, bottom: top + ph }],
      origin: { x: left + pw / 2, y: top + ph / 2 }
    };
  }

  var plans = [];
  function planFor(geo, n) {
    while (plans.length <= n) {
      var prev = plans.length ? pickSurvivor(plans[plans.length - 1], hashSeed('sprout:' + (plans.length - 1))) : null;
      plans.push(planLap(geo, hashSeed('sprout:lap:' + plans.length), prev));
    }
    return plans[n];
  }

  function draw() {
    var geo = layout();
    if (geo.width < 20) return;
    var plan = planFor(geo, lap);
    var show;
    if (frac <= 0) show = plan.segments.slice(0, plan.firstCount);
    else if (frac >= 1) show = plan.segments;
    else {
      var visibleN = plan.segments.filter(function (s) { return s.visible; }).length;
      var want = Math.max(1, Math.round(frac * visibleN));
      show = [];
      var seen = 0;
      for (var i = 0; i < plan.segments.length; i++) {
        show.push(plan.segments[i]);
        if (plan.segments[i].visible) seen++;
        if (seen >= want) break;
      }
    }
    field.setAttribute('viewBox', '0 0 ' + geo.width + ' ' + geo.height);
    field.innerHTML = show.map(function (s) {
      return '<line class="seg' + (s.thick || s.order === 0 ? ' thick' : '') + '" x1="' + s.x1.toFixed(1) + '" y1="' + s.y1.toFixed(1) + '" x2="' + s.x2.toFixed(1) + '" y2="' + s.y2.toFixed(1) + '"/>';
    }).join('');
    stage.dataset.flash = flash || 'false';
    read.textContent = 'Lap ' + (lap + 1) + '  ·  ' + Math.round(frac * 100) + '% of the goal';
    playBtn.textContent = playing ? 'Growing' : 'Paused';
    playBtn.setAttribute('aria-pressed', String(playing));
  }

  var last = 0;
  function tick(t) {
    if (!playing || frame) { draw(); return; }
    var dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
    last = t;
    if (flash === 'true') { /* hold */ }
    else if (flash === 'fading') { /* css */ }
    else {
      frac += dt * 0.085;
      if (frac >= 1) {
        frac = 1;
        flash = 'true';
        setTimeout(function () { flash = 'fading'; draw(); }, reduced ? 0 : 900);
        setTimeout(function () { flash = null; frac = 0; lap += 1; draw(); }, reduced ? 0 : 2100);
      }
    }
    draw();
    requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', function () {
    playing = !playing;
    if (playing) { last = 0; requestAnimationFrame(tick); }
    else draw();
  });
  document.getElementById('reset').addEventListener('click', function () {
    lap = 0; frac = 0; flash = null; plans = []; draw();
  });
  window.addEventListener('resize', function () { plans = []; draw(); });
  draw();
  if (playing) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
