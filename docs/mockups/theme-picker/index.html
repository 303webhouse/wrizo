<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme picker — brand cards</title>
<!--
  Round 2. Brand cards, not UI screenshots.
  Arbor calls the menu Mood and wears the garden icons. Flux calls it Skin.
  Order: Arbor, Machina, Flux. Nomad and Volant are absent until they are built.
  Arbor's mode strip ends in Boards →. Flux's ends in Schematic →.
  Unlocked cards are full colour. Locked cards carry the word count and do not click.
  Current: brass outline. Flux's current card is cyan, with the thin orange bar on the left.
  Hover (unlocked): the rhizome grows over Arbor, Run advances, the glitch tick fires.
  Reduced motion holds the grown still.
  ?frame=arbor-dark|arbor-light|flux-dark|flux-light
-->
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Crimson+Pro:ital,wght@0,500;1,400&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --brass: #ff9800; --cyan: #00C2FF; --lime: #A6FF3D; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { overflow: hidden; font-family: "Crimson Pro", Georgia, serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; border-radius: 0; }
  button:disabled { cursor: default; }
  svg { display: block; }
  .rig { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #000; color: #c8c8c8; font-family: "Chakra Petch", sans-serif; font-size: 12px; letter-spacing: .08em; }
  html.shot .rig { display: none; }
  .rig button { height: 24px; padding: 0 8px; border: 1px solid #333; }
  .rig button[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
  .desk { height: calc(100% - 36px); display: grid; grid-template-columns: 92px 1fr; position: relative; }
  html.shot .desk { height: 100%; }
  body[data-host="arbor"] { background: #1c1612; color: #f4efe4; }
  body[data-host="arbor"][data-field="light"] { background: #f4efe4; color: #2b2418; }
  body[data-host="flux"] { background: #04141a; color: #e3f1ec; }
  body[data-host="flux"][data-field="light"] { background: #e7f2f0; color: #042632; }
  .rail { display: none; flex-direction: column; align-items: stretch; padding: 10px 0 8px; gap: 2px; border-right: 1px solid transparent; }
  body[data-host="arbor"] .rail-arbor, body[data-host="flux"] .rail-flux { display: flex; }
  .rail-arbor { background: #14110e; border-color: #3a3228; color: #d9c39a; }
  .rail-flux { background: #101c24; border-color: #1d4a52; color: #9ad7ea; font-family: "Chakra Petch", sans-serif; }
  .ri { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; padding: 6px 4px; font-size: 10px; letter-spacing: .08em; }
  .ri svg { width: 20px; height: 20px; }
  .ri.on { color: var(--brass); }
  .rail-flux .ri.on, .rail-flux .mood { color: var(--cyan); }
  .gap { flex: 1; }
  .mood { width: 100%; min-height: 44px; padding: 8px 0; text-align: center; font-size: 10px; letter-spacing: .08em; border-top: 1px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .rail-arbor .mood { color: var(--brass); border-color: #3a3228; }
  .rail-flux .mood { border-color: #1d4a52; }
  .stage { position: relative; padding: 36px 28px 16px; min-width: 0; }
  .page { max-width: 640px; margin: 0 auto; min-height: 280px; padding: 48px 48px; font-size: 20px; line-height: 1.6; }
  body[data-host="arbor"] .page { background: #f4efe4; color: #2b2418; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  body[data-host="arbor"][data-field="light"] .page { background: #fffaf3; color: #2b2418; box-shadow: none; border: 1px solid #e4d8c8; }
  body[data-host="flux"] .page { background: #0e1c24; color: #e8f6fa; border: 1px solid #1d4a52; }
  body[data-host="flux"][data-field="light"] .page { background: #f4f7f8; color: #042632; border-color: #00c2ff; }
  .picker {
    position: absolute; left: 20px; right: 20px; bottom: 16px; z-index: 3;
    display: flex; flex-direction: column; gap: 12px; padding: 14px;
  }
  body[data-host="arbor"] .picker { background: #1a1612; border: 1px solid #3a3228; color: #f4efe4; }
  body[data-host="arbor"][data-field="light"] .picker { background: #fffaf3; border-color: #e4d8c8; color: #2b2418; }
  body[data-host="flux"] .picker { background: #101c24; border: 1px solid #1d4a52; color: #e7f4f1; font-family: "Chakra Petch", sans-serif; }
  body[data-host="flux"][data-field="light"] .picker { background: #f4f7f8; border-color: #b7d0d6; color: #042632; }
  .phead { display: flex; align-items: center; gap: 16px; }
  .phead b { font-weight: 500; letter-spacing: .16em; font-size: 13px; text-transform: uppercase; }
  .field { margin-left: auto; display: flex; gap: 6px; }
  .field button { height: 28px; min-width: 64px; padding: 0 10px; border: 1px solid currentColor; opacity: .7; font-size: 12px; letter-spacing: .08em; }
  .field button[aria-pressed="true"] { opacity: 1; }
  .topmodes { display: flex; justify-content: flex-end; margin: 0 0 14px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .modes-arbor, .modes-flux { display: none; gap: 16px; align-items: center; }
  body[data-host="arbor"] .modes-arbor { display: flex; color: #d9cbb8; }
  body[data-host="flux"] .modes-flux { display: flex; color: #9ad7ea; font-family: "Chakra Petch", sans-serif; }
  .topmodes .on { color: var(--brass); box-shadow: inset 0 -1px 0 var(--brass); padding-bottom: 2px; }
  body[data-host="flux"] .topmodes .on { color: var(--cyan); box-shadow: inset 0 -1px 0 var(--cyan); }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; min-height: 250px; text-align: center; padding: 0;
    border: 2px solid transparent; position: relative; overflow: hidden; background: transparent;
  }
  .card:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  body[data-host="arbor"] .card[aria-pressed="true"] { border-color: var(--brass); }
  body[data-host="flux"] .card[aria-pressed="true"] { border-color: var(--cyan); }
  body[data-host="flux"] .card[aria-pressed="true"]::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--brass); z-index: 6;
  }
  .card.locked .plate { filter: grayscale(1); opacity: .5; }
  .plate { flex: 1; position: relative; min-height: 210px; }
  .wm {
    position: absolute; left: 0; right: 0; bottom: 18px; z-index: 2;
    font-size: 34px; letter-spacing: .02em; text-align: center; line-height: 1;
  }
  .note { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 4; font-size: 12px; line-height: 1.3; letter-spacing: 0; text-align: center; color: #d7d7d7; }
  .arbor .plate { background: radial-gradient(120% 80% at 50% 0%, #3a2e24, #1c1612 70%); }
  .arbor .wm { font-family: "Crimson Pro", Georgia, serif; color: #f4efe4; }
  .rhizome, .grow { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grow { z-index: 3; opacity: 0; }
  .grow path { stroke-dasharray: 120; stroke-dashoffset: 120; }
  .mach .plate { background: #0a0b0e; }
  .mach .wm { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; letter-spacing: .16em; font-size: 26px; color: #e6e9f1; }
  .mach .oq { position: absolute; top: 14px; right: 14px; width: 12px; height: 12px; border: 2px solid var(--brass); z-index: 2; }
  .rules { position: absolute; left: 16px; right: 16px; top: 18px; height: 64px; }
  .runline { position: absolute; left: 16px; right: 16px; bottom: 78px; height: 6px; display: flex; gap: 3px; align-items: flex-end; }
  .runline i { flex: 1; height: 4px; background: #343a46; position: relative; }
  .runline i.on { background: #9da5b4; }
  .runline i.here::after { content: ""; position: absolute; left: -1px; top: -6px; width: 3px; height: 16px; background: var(--brass); }
  .flux .plate { background: radial-gradient(90% 70% at 50% 0%, rgba(0,194,255,.28), #04141a 62%); }
  .flux .wm { font-family: "Chakra Petch", sans-serif; font-weight: 600; letter-spacing: .2em; color: var(--cyan); font-size: 30px; }
  .prompt { position: absolute; left: 16px; top: 36px; font-family: "Chakra Petch", sans-serif; font-size: 22px; color: var(--cyan); letter-spacing: .08em; }
  .tick { position: absolute; left: 18%; right: 18%; top: 46%; height: 2px; background: var(--cyan); }
  .tick.lime { top: 54%; background: var(--lime); opacity: .8; }
  .card.flux:hover .tick, .card.flux:focus-visible .tick { animation: glitch .45s steps(2, end) infinite; }
  .card.arbor:hover .grow, .card.arbor:focus-visible .grow { opacity: 1; }
  .card.arbor:hover .grow path, .card.arbor:focus-visible .grow path { stroke-dashoffset: 0; transition: stroke-dashoffset 1.1s ease; }
  .card.mach:hover .runline i, .card.mach:focus-visible .runline i { background: #9da5b4; transition: background .4s ease; }
  .card.mach:hover .runline i.here::after, .card.mach:focus-visible .runline i.here::after { left: calc(100% - 2px); transition: left .7s ease; }
  @keyframes glitch {
    0% { transform: none; opacity: 1; }
    40% { transform: translateX(10px); opacity: .35; }
    70% { transform: translateX(-6px); opacity: .9; filter: none; }
    100% { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .grow { opacity: 1; }
    .grow path { stroke-dashoffset: 0; transition: none; }
    .card.mach .runline i { background: #9da5b4; }
    .card.mach .runline i.here::after { left: calc(100% - 2px); }
    .tick { animation: none; }
    .card.flux:hover .tick, .card.flux:focus-visible .tick { animation: none; transform: translateX(6px); }
  }
</style>
</head>
<body data-host="arbor" data-field="dark">
<header class="rig">
  <b>THEME PICKER</b>
  <button type="button" data-frame="arbor-dark">Arbor dark</button>
  <button type="button" data-frame="arbor-light">Arbor light</button>
  <button type="button" data-frame="flux-dark">Flux dark</button>
  <button type="button" data-frame="flux-light">Flux light</button>
</header>
<div class="desk">
  <aside class="rail rail-arbor" aria-label="Arbor">
    <div class="ri" data-g="drawer">Drawer</div>
    <div class="ri on" data-g="pages">Pages</div>
    <div class="ri" data-g="boards">Boards</div>
    <div class="ri" data-g="journal">Journal</div>
    <div class="gap"></div>
    <div class="mood" id="mood" data-g="mood">Mood</div>
    <div class="ri" data-g="settings">Settings</div>
    <div class="ri" data-g="trash">Trash</div>
  </aside>
  <aside class="rail rail-flux" aria-label="Flux">
    <div class="ri">Docs</div>
    <div class="ri on">Circuits</div>
    <div class="ri">Log</div>
    <div class="gap"></div>
    <div class="mood" id="skin">Skin</div>
    <div class="ri">Config</div>
    <div class="ri">Trash</div>
  </aside>
  <div class="stage">
    <div class="topmodes">
      <div class="modes-arbor" aria-label="Modes">
        <span>Free write</span><span class="on">Draft</span><span>Revise</span><span>Workshop</span><span>Publish</span><span>Boards →</span>
      </div>
      <div class="modes-flux" aria-label="Modes">
        <span>Wire In</span><span class="on">Draft</span><span>Revise</span><span>Workshop</span><span>Uplink</span><span>Schematic →</span>
      </div>
    </div>
    <article class="page" id="page">The lamp stays. The page is the only thing that has to.</article>
    <div class="picker" role="dialog" aria-labelledby="ptitle">
      <div class="phead">
        <b id="ptitle">Mood</b>
        <div class="field" role="group" aria-label="Page">
          <button type="button" id="dark" aria-pressed="true">Dark</button>
          <button type="button" id="light" aria-pressed="false">Light</button>
        </div>
      </div>
      <div class="cards">
        <button class="card arbor" type="button" data-theme="arbor" aria-pressed="true">
          <div class="plate" aria-hidden="true">
            <svg class="rhizome" viewBox="0 0 280 220">
              <g fill="none" stroke="#96a05a" stroke-width="1.15" stroke-linecap="round">
                <path d="M148 86 C132 70 118 74 96 58"/>
                <path d="M118 66 C104 52 92 58 70 44"/>
                <path d="M148 86 C160 62 168 48 154 28"/>
                <path d="M162 52 C178 40 196 46 214 32"/>
                <path d="M148 86 C176 78 198 88 228 74"/>
                <path d="M198 82 C210 96 206 112 220 124"/>
                <path d="M148 86 C124 102 108 96 82 112"/>
                <path d="M108 100 C92 114 98 132 78 146"/>
                <path d="M148 86 C156 108 142 124 158 142"/>
                <path d="M152 118 C170 128 166 146 184 152"/>
                <path d="M96 58 C84 48 78 36 88 26"/>
                <path d="M82 112 C64 104 52 112 40 100"/>
              </g>
            </svg>
            <svg class="grow" viewBox="0 0 280 220" aria-hidden="true">
              <g fill="none" stroke="#c6b15a" stroke-width="1.35" stroke-linecap="round">
                <path d="M158 142 C150 160 132 168 118 186"/>
                <path d="M118 186 C104 198 96 206 78 208"/>
                <path d="M158 142 C176 164 168 182 188 198"/>
                <path d="M184 152 C200 170 192 188 210 200"/>
                <path d="M148 86 C140 120 120 150 132 188"/>
                <path d="M132 188 C124 200 140 210 156 206"/>
              </g>
            </svg>
            <div class="wm">Arbor</div>
          </div>
        </button>
        <button class="card mach" type="button" data-theme="machina" aria-pressed="false">
          <div class="plate" aria-hidden="true">
            <svg class="rules" viewBox="0 0 240 70" fill="none" stroke="#7FA0BC" stroke-width="1">
              <path d="M8 14 H232 M8 32 H180 M8 50 H210"/>
              <path d="M40 8 V58 M120 8 V58 M200 8 V58" stroke="#343a46"/>
            </svg>
            <span class="oq"></span>
            <div class="runline"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="here"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="wm">MACHINA</div>
          </div>
        </button>
        <button class="card flux" type="button" data-theme="flux">
          <div class="plate" aria-hidden="true">
            <div class="prompt">&gt;_</div>
            <div class="tick"></div>
            <div class="tick lime"></div>
            <div class="wm">FLUX</div>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var G = {
    drawer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12.5" rx="1.2"/><path d="M3.5 14.2h17"/><circle cx="12" cy="11.1" r="0.9"/><circle cx="12" cy="17.4" r="0.9"/><path d="M12 8V4.6"/><path d="M12 6.1C10.6 4.6 8.9 4.5 8 5.3c1.1 1.2 2.7 1.4 4 .8z"/><path d="M12 5c1.2-1.6 3-1.9 4-1.2-.9 1.3-2.5 1.7-4 1.2z"/></svg>',
    pages: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 17.5c.2-3.6 2.6-5.6 6.4-5.6-.2 3.7-2.8 5.8-6.4 5.6z"/><path d="M9 17.5l4.2-3.6"/></svg>',
    boards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="7.5" height="5.5" rx="1.5"/><rect x="13.5" y="9" width="7.5" height="5.5" rx="1.5"/><rect x="4.5" y="15.5" width="7.5" height="5.5" rx="1.5"/><path d="M10.5 6.2c2.4 0 4 .8 4.8 2.8"/><path d="M15.6 14.5c-.6 2-1.8 3.3-3.6 3.8"/></svg>',
    journal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="13.5" height="17.5" rx="1.5"/><path d="M8.2 3v17.5"/><path d="M11 13.6c.4-3 2.4-4.7 5.4-4.9-.2 3-2.3 4.9-5.4 4.9z"/><path d="M11 13.6l3.6-3.2"/><path d="M14.5 20.5v3l1.2-.9 1.2.9v-3"/></svg>',
    mood: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.4"/><path d="M9 2.5v1.4M9 14.1v.6M2.5 9h1.4M3.8 3.8l1 1M14.2 3.8l-1 1M3.8 14.2l1-1"/><path d="M10 20h8.6a3 3 0 0 0 0-6 4.4 4.4 0 0 0-8.3-.9A3.5 3.5 0 0 0 10 20z"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 19.6l4.4-4.4" stroke-width="3.2"/><path d="M8.8 15.2l1.8-1.8"/><path d="M10.6 13.4C9.4 10.6 10.4 7 13.6 4.8 15.6 3.4 19.4 3 21 3c0 1.6-.4 5.4-1.8 7.4-2.2 3.2-5.8 4.2-8.6 3z"/><path d="M10.6 13.4l6.2-6.2"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5h15"/><path d="M10 7.5V5.2h4v2.3"/><path d="M6.2 7.5l1.1 13.5h9.4l1.1-13.5"/><path d="M10 17.5c.1-2.6 1.8-4 4.2-4.1-.1 2.6-1.8 4.1-4.2 4.1z"/><path d="M10 17.5l2.8-2.5"/></svg>'
  };
  document.querySelectorAll('[data-g]').forEach(function (el) {
    el.insertAdjacentHTML('afterbegin', G[el.dataset.g]);
  });
  var body = document.body;
  var frames = {
    'arbor-dark': ['arbor', 'dark', 388],
    'arbor-light': ['arbor', 'light', 388],
    'flux-dark': ['flux', 'dark', 1240],
    'flux-light': ['flux', 'light', 1240]
  };
  var gates = { flux: 1000 };
  function more(written, gate) {
    return (gate - written).toLocaleString('en-US');
  }
  function apply(name) {
    var pair = frames[name];
    var host = pair[0];
    var written = pair[2];
    body.dataset.host = host;
    body.dataset.field = pair[1];
    document.getElementById('ptitle').textContent = host === 'flux' ? 'Skin' : 'Mood';
    document.getElementById('dark').setAttribute('aria-pressed', pair[1] === 'dark' ? 'true' : 'false');
    document.getElementById('light').setAttribute('aria-pressed', pair[1] === 'light' ? 'true' : 'false');
    document.querySelectorAll('.card').forEach(function (card) {
      var theme = card.dataset.theme;
      var name = theme === 'machina' ? 'Machina' : theme.charAt(0).toUpperCase() + theme.slice(1);
      var open = theme === 'arbor' || theme === 'machina' || written >= gates.flux;
      card.disabled = !open;
      card.classList.toggle('locked', !open);
      card.setAttribute('aria-pressed', open && theme === host ? 'true' : 'false');
      if (!open && gates[theme]) card.setAttribute('aria-label', name + '. ' + more(written, gates[theme]) + ' more words to open ' + name);
      else card.setAttribute('aria-label', name);
    });
    document.querySelectorAll('[data-note]').forEach(function (note) {
      var theme = note.dataset.note;
      var gate = gates[theme];
      if (written >= gate) { note.textContent = ''; return; }
      note.textContent = more(written, gate) + ' more words to open Flux';
    });
    var flux = document.querySelector('.card.flux');
    if (written < gates.flux) {
      var fluxNote = flux.querySelector('.note');
      if (!fluxNote) {
        fluxNote = document.createElement('div');
        fluxNote.className = 'note';
        fluxNote.dataset.note = 'flux';
        flux.appendChild(fluxNote);
      }
      fluxNote.textContent = more(written, gates.flux) + ' more words to open Flux';
    } else {
      var gone = flux.querySelector('.note');
      if (gone) gone.remove();
    }
    document.querySelectorAll('.rig button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.frame === name ? 'true' : 'false');
    });
    document.getElementById('page').textContent = host === 'flux'
      ? 'The glass holds. The grid is the room’s, not the sentence’s.'
      : 'The lamp stays. The page is the only thing that has to.';
  }
  var q = new URLSearchParams(location.search).get('frame') || 'arbor-dark';
  if (!frames[q]) q = 'arbor-dark';
  if (new URLSearchParams(location.search).has('frame')) document.documentElement.classList.add('shot');
  apply(q);
  document.querySelectorAll('.rig button').forEach(function (b) {
    b.addEventListener('click', function () { apply(b.dataset.frame); });
  });
  document.getElementById('dark').addEventListener('click', function () { apply(body.dataset.host + '-dark'); });
  document.getElementById('light').addEventListener('click', function () { apply(body.dataset.host + '-light'); });
})();
</script>
</body>
</html>
