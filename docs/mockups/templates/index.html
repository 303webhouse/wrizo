<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrizo · Page templates mockup</title>
<!--
  docs/mockups/templates — what the four greyed Draft Templates produce.
  Screenplay is live in product (ScriptEditor: Courier, slug / action / dialogue).
  This mockup makes Outline, Title Page, Bibliography, and Custom clickable
  so the pages they mint can be judged. Custom is a save-this-layout flow,
  not a blank page. Fake Night Kitchen data. Plateau tokens, r7/live drawer.
  Branch: cursor/templates-mockup.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime:ital,wght@0,400;1,400&display=swap');

  :root {
    --ink-950: #110600; --ink-900: #1F1A16; --ink-800: #2A241E;
    --ink-border: #332C25; --ink-border-strong: #453B31;
    --text-hi: #EDE6DA; --text-mid: #B5A998; --text-low: #80766A;
    --paper: #F3EDE1; --ink-on-paper: #2B2014; --ink-on-paper-low: #8A7C68;
    --card-stock: #FBF6EA; --card-hairline: #D9CFB6;
    --brass: #ff9800; --accent-rest: #96a05a; --accent-door: #4F5730; --brick: #B5543F;
    --desk-ground: #1F1A16; --rail-surface: #110600;
    --font-ui: 'Figtree', system-ui, sans-serif;
    --font-prose: 'Crimson Pro', Georgia, serif;
    --font-script: 'Courier Prime', 'Courier New', monospace;
    --fade-dur: .2s;
    --pop-w: 220px;
    --sb: color-mix(in srgb, var(--text-low) 28%, transparent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0;
      scrollbar-width: thin; scrollbar-color: var(--sb) transparent; }
  *::-webkit-scrollbar { width: 4px; height: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--sb); }
  html, body { height: 100%; overflow: hidden; }
  body { background: #000; color: var(--text-hi); font-family: var(--font-ui); }
  button, input { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }

  .rig {
    position: fixed; inset: 0 0 auto 0; z-index: 40;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 7px 12px; background: #000; border-bottom: 1px solid #222;
    font-size: 11px; color: #9a9a9a;
  }
  .rig b { color: #d8d8d8; font-weight: 600; letter-spacing: .06em; }
  .rig .rev { height: 22px; padding: 0 8px; border: 1px solid #333; color: #c8c8c8; background: #141414; font-size: 11px; }
  .rig .rev[data-on='true'] { border-color: var(--accent-rest); color: var(--accent-rest); }
  .rig .hint { margin-left: auto; color: #6e6e6e; max-width: 42ch; text-align: right; }
  .stamp {
    position: fixed; right: 10px; bottom: 10px; z-index: 60;
    font-size: 10px; letter-spacing: .08em; color: #8a8276;
    background: rgba(0,0,0,.72); border: 1px solid #2a2a2a; padding: 3px 8px;
    pointer-events: none;
  }

  .fit { position: absolute; inset: 42px 0 0 0; overflow: hidden; }
  .stage {
    width: min(1280px, 100%); height: 100%; margin: 0 auto;
    background: var(--ink-950); display: grid; grid-template-columns: 84px minmax(0, 1fr);
  }
  .desk {
    background: var(--rail-surface); border-right: 1px solid var(--ink-border);
    display: flex; flex-direction: column; align-items: center; padding-top: 14px;
  }
  .desk .cat { width: 100%; text-align: center; padding: 9px 0 8px; color: var(--text-low); font-size: 10px; letter-spacing: .08em; }
  .desk .cat .glyph { display: block; font-size: 15px; margin-bottom: 3px; color: var(--text-mid); }
  .desk .cat[data-on='true'], .desk .cat[data-on='true'] .glyph { color: var(--accent-rest); }

  .page-col { position: relative; overflow: hidden; min-width: 0; }
  .paper {
    position: absolute;
    top: 18px; bottom: 22px;
    left: calc(28px + var(--pop-w));
    right: calc(16px + var(--pop-w));
    background: var(--paper); color: var(--ink-on-paper);
    box-shadow: 0 0 0 1px rgba(0,0,0,.35);
    overflow: auto; padding: 36px 56px 56px 64px;
  }
  .paper[data-kind='title'],
  .paper[data-kind='screenplay'] { font-family: var(--font-script); font-size: 15px; line-height: 1.45; }
  .paper[data-kind='draft'],
  .paper[data-kind='outline'],
  .paper[data-kind='bibliography'] { font-family: var(--font-prose); font-size: 18px; line-height: 1.7; }
  .paper .kicker {
    font-family: var(--font-ui); font-size: 10px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-on-paper-low); margin-bottom: 22px;
  }
  .paper .page-foot {
    position: absolute; bottom: 16px; left: 64px; right: 56px;
    font-family: var(--font-ui); font-size: 10px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-on-paper-low);
  }
  .ghost { color: var(--ink-on-paper-low); }

  .caret {
    display: inline-block; width: 1.5px; height: 1.1em; background: var(--ink-on-paper);
    vertical-align: text-bottom; margin-left: 1px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
    .sliver .panel { transition: none; }
  }

  /* Outline */
  .ol { list-style: none; }
  .ol li { display: flex; align-items: baseline; gap: 10px; min-height: 1.7em; margin: 0 0 .15em; }
  .ol .num {
    flex: 0 0 auto; font-variant-numeric: tabular-nums; color: var(--ink-on-paper-low);
    min-width: 2.2em;
  }
  .ol .txt { flex: 1; min-width: 0; outline: none; white-space: pre-wrap; }
  .ol .txt:empty::before { content: attr(data-hint); color: var(--ink-on-paper-low); }

  /* Title page — manuscript */
  .ms { position: relative; min-height: calc(100% - 40px); }
  .ms-contact {
    position: absolute; top: 0; left: 0; max-width: 28ch;
    white-space: pre-wrap; line-height: 1.45;
  }
  .ms-contact[contenteditable] { outline: none; }
  .ms-mid {
    position: absolute; top: 32%; left: 0; right: 0;
    text-align: center; letter-spacing: .04em;
  }
  .ms-title { text-transform: uppercase; letter-spacing: .12em; min-height: 1.45em; outline: none; }
  .ms-title:empty::before { content: attr(data-hint); color: var(--ink-on-paper-low); text-transform: uppercase; }
  .ms-by { margin: 1.2em 0; color: var(--ink-on-paper); }
  .ms-author { outline: none; min-height: 1.45em; }
  .ms-author:empty::before { content: attr(data-hint); color: var(--ink-on-paper-low); }

  /* Bibliography */
  .bib { list-style: none; }
  .bib li {
    padding-left: 2.2em; text-indent: -2.2em; margin-bottom: 1.05em;
    outline: none; min-height: 1.7em;
  }
  .bib li:empty::before { content: attr(data-hint); color: var(--ink-on-paper-low); text-indent: 0; padding-left: 0; display: inline-block; }

  /* Screenplay — shipped ScriptEditor rhythm */
  .script { font-family: var(--font-script); font-size: 15px; line-height: 1.45; max-width: 60ch; }
  .script .slug { text-transform: uppercase; letter-spacing: .04em; margin: 1.6em 0 .45em; }
  .script .slug:first-child { margin-top: 0; }
  .script .act { margin: .7em 0; }
  .script .char { text-align: center; margin: 1.1em 0 0; text-transform: uppercase; }
  .script .dial { padding: 0 0 0 10ch; max-width: 45ch; }
  .script .ghost-line { color: var(--ink-on-paper-low); }

  /* Draft body */
  .draft { outline: none; min-height: 8em; white-space: pre-wrap; }
  .draft:empty::before { content: attr(data-hint); color: var(--ink-on-paper-low); }

  /* Save-as-template sheet */
  .veil {
    position: absolute; inset: 0; z-index: 8;
    background: color-mix(in srgb, var(--ink-950) 28%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  .sheet {
    width: min(340px, calc(100% - 48px));
    background: var(--desk-ground); color: var(--text-hi);
    border: 1px solid var(--ink-border); padding: 18px 18px 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .sheet .h { margin-bottom: 8px; }
  .sheet .lead { font-size: 13px; color: var(--text-mid); line-height: 1.45; margin-bottom: 14px; }
  .sheet .from {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent-rest); margin-bottom: 14px;
  }
  .sheet label {
    display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent-rest); margin-bottom: 6px;
  }
  .sheet input {
    width: 100%; background: var(--ink-800); border: 1px solid var(--ink-border);
    color: var(--text-hi); padding: 8px 9px; font-size: 13px; margin-bottom: 16px;
  }
  .sheet input:focus { border-color: var(--brass); outline: none; }
  .sheet .acts { display: flex; justify-content: flex-end; gap: 8px; }
  .sheet .no { border: 1px solid var(--ink-border); color: var(--text-mid); padding: 5px 10px; font-size: 12px; }
  .sheet .go {
    border: 1px solid var(--brass); color: var(--brass);
    background: color-mix(in srgb, var(--brass) 16%, transparent);
    padding: 5px 12px; font-size: 12px;
  }

  .sliver {
    position: absolute; top: 18px; bottom: 22px; left: 28px;
    width: var(--pop-w); z-index: 6; pointer-events: none;
  }
  .sliver .grip { pointer-events: auto; }
  .sliver .clip {
    position: absolute; top: 0; bottom: 0; left: 0; right: 16px;
    overflow: hidden; pointer-events: none;
  }
  .sliver[data-open='true'] .clip { pointer-events: auto; }
  .sliver .panel {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    background: var(--desk-ground); border: 1px solid var(--ink-border); border-right: none;
    transform: translateX(100%);
    transition: transform var(--fade-dur) ease;
  }
  .sliver[data-open='true'] .panel { transform: translateX(0); }
  .sliver .grip {
    position: absolute; top: 16px; right: 0; width: 16px; height: 34px; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    background: var(--desk-ground); border: 1px solid var(--ink-border); border-right: none;
    color: var(--text-mid); font-size: 12px;
  }
  .sliver[data-open='true'] .grip { color: var(--brass); border-color: var(--brass); }

  .popout {
    position: absolute; top: 18px; bottom: 22px; right: 16px;
    width: var(--pop-w); z-index: 6; pointer-events: none;
  }
  .popout .grip { pointer-events: auto; }
  .popout .clip {
    position: absolute; top: 0; bottom: 0; left: 16px; right: 0;
    overflow: hidden; pointer-events: none;
  }
  .popout[data-open='true'] .clip { pointer-events: auto; }
  .popout .panel {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    background: var(--desk-ground); border: 1px solid var(--ink-border); border-left: none;
    transform: translateX(-100%);
    transition: transform var(--fade-dur) ease;
  }
  .popout[data-open='true'] .panel { transform: translateX(0); }
  .popout .grip {
    position: absolute; top: 16px; left: 0; width: 16px; height: 34px; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    background: var(--desk-ground); border: 1px solid var(--ink-border); border-left: none;
    color: var(--text-mid); font-size: 12px;
  }
  .popout[data-open='true'] .grip { color: var(--brass); border-color: var(--brass); }

  .body { display: flex; flex-direction: column; gap: 20px; padding: 16px 14px; }
  .h { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-rest); }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  .mode-tbtn {
    min-width: 24px; height: 24px; padding: 0 4px; border: 1px solid transparent;
    color: var(--text-mid); font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
  }
  .mode-tbtn:hover { border-color: var(--ink-border); color: var(--text-hi); }
  .mode-tbtn[data-on='true'] {
    border-color: var(--brass); color: var(--brass);
    background: color-mix(in srgb, var(--brass) 16%, transparent);
  }
  .mode-tbtn svg { display: block; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .type-stack { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .type-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 24px; gap: 3px; width: 100%; }
  .wz-type-face {
    width: 100%; text-align: left; padding: 4px 8px; color: var(--brass);
    border: 1px solid var(--brass); font-size: 13px; white-space: nowrap;
    background: color-mix(in srgb, var(--brass) 12%, transparent);
  }
  .wz-type-num {
    width: auto; min-width: 0; text-align: center; padding: 3px 2px; color: var(--brass);
    border: 1px solid var(--brass); font-size: 12px;
    background: color-mix(in srgb, var(--brass) 12%, transparent);
  }
  .saved-chip {
    max-width: 100%; height: 24px; padding: 0 7px; border: 1px solid var(--brass);
    color: var(--brass); font-size: 10px; letter-spacing: .04em;
    background: color-mix(in srgb, var(--brass) 12%, transparent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50;
    background: var(--ink-900); border: 1px solid var(--ink-border);
    color: var(--text-hi); font-size: 12px; padding: 8px 14px; opacity: 0; pointer-events: none;
  }
  .toast[data-on='true'] { opacity: 1; }

  @media (max-width: 720px) {
    .rig .hint { display: none; }
    .stage { grid-template-columns: minmax(0, 1fr); width: 100%; }
    .desk { display: none; }
    .paper { inset: 8px; left: 8px; right: 8px; padding: 20px 18px 28px 22px; }
    .sliver, .popout { top: 8px; bottom: 8px; width: min(var(--pop-w), calc(100% - 24px)); }
    .sliver { left: 8px; }
    .popout { right: 8px; }
  }
</style>
</head>
<body>
<header class="rig">
  <b>TEMPLATES</b>
  <button class="rev" data-view="outline" type="button">Outline</button>
  <button class="rev" data-view="title" type="button">Title Page</button>
  <button class="rev" data-view="bibliography" type="button">Bibliography</button>
  <button class="rev" data-view="custom" type="button">Custom</button>
  <button class="rev" data-view="screenplay" type="button">Screenplay</button>
  <button class="rev" data-fill="blank" type="button">Blank</button>
  <button class="rev" data-fill="typed" type="button">Typed</button>
  <span class="hint" id="revHint">Four greyed templates, now producing a page. Screenplay is the live reference.</span>
</header>
<div class="stamp" id="stamp">TEMPLATES · OUTLINE</div>

<div class="fit">
  <div class="stage">
    <nav class="desk" aria-label="Desk">
      <button class="cat" type="button"><span class="glyph">⌂</span>Desk</button>
      <button class="cat" data-on="true" type="button"><span class="glyph">✎</span>Pages</button>
      <button class="cat" type="button"><span class="glyph">▦</span>Boards</button>
      <button class="cat" type="button"><span class="glyph">⌘</span>Plan</button>
    </nav>
    <div class="page-col">
      <aside class="sliver" id="sliver" data-open="true">
        <div class="clip">
          <div class="panel">
            <div class="body">
              <div class="sec">
                <div class="h">Typeface</div>
                <div class="type-stack">
                  <div class="type-row">
                    <button class="mode-tbtn" type="button">−</button>
                    <div class="wz-type-face" id="faceVal">Crimson Pro</div>
                    <button class="mode-tbtn" type="button">+</button>
                  </div>
                  <div class="type-row">
                    <button class="mode-tbtn" type="button">−</button>
                    <div class="wz-type-num">18</div>
                    <button class="mode-tbtn" type="button">+</button>
                  </div>
                </div>
              </div>
              <div class="sec">
                <div class="h">Format</div>
                <div class="row">
                  <button class="mode-tbtn" type="button"><b>B</b></button>
                  <button class="mode-tbtn" type="button"><i>I</i></button>
                  <button class="mode-tbtn" type="button"><u>U</u></button>
                  <button class="mode-tbtn" type="button">•</button>
                </div>
              </div>
              <div class="sec">
                <div class="h">Actions</div>
                <div class="row">
                  <button class="mode-tbtn" type="button" title="Tags">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2.5 2.5h6.2L13.5 7.3 8.7 12.1 2.5 5.9z"/><circle cx="5.2" cy="5.2" r=".9" fill="currentColor" stroke="none"/></svg>
                  </button>
                  <button class="mode-tbtn" type="button" title="Copy">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="5.5" y="5.5" width="8" height="8"/><path d="M10.5 5.5V3.5H2.5v8h2"/></svg>
                  </button>
                  <button class="mode-tbtn" type="button" title="Delete">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3.5 4.5h9M6 4.5V3h4v1.5M5.5 6.5v6M8 6.5v6M10.5 6.5v6M4.5 4.5l.7 9h5.6l.7-9"/></svg>
                  </button>
                  <button class="mode-tbtn" data-on="true" type="button" title="Header/Footer">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3.5" y="2.5" width="9" height="11"/><path d="M3.5 5h9M3.5 11h9"/></svg>
                  </button>
                </div>
              </div>
              <div class="sec" id="tmplSec">
                <div class="h">Templates</div>
                <div class="row" id="tmplRow">
                  <button class="mode-tbtn" data-tmpl="screenplay" type="button" title="Screenplay">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2.5 3.5h6M2.5 7h11M5.5 10.5h6M5.5 13h4"/></svg>
                  </button>
                  <button class="mode-tbtn" data-tmpl="outline" type="button" title="Outline">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3 3h10M5 7h8M7 11h6M3 15h8"/></svg>
                  </button>
                  <button class="mode-tbtn" data-tmpl="bibliography" type="button" title="Bibliography">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3 2.5v11M4.2 2.5h8.3v11H4.2zM6.2 5.5h4.5M6.2 8h4.5M6.2 10.5h3"/></svg>
                  </button>
                  <button class="mode-tbtn" data-tmpl="title" type="button" title="Title page">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3.5 2.5h9v11h-9zM6 6.2h4"/></svg>
                  </button>
                  <button class="mode-tbtn" data-tmpl="custom" type="button" title="Save as template">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 3v10M3 8h10"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button class="grip" id="sliverGrip" type="button" aria-label="Tools">‹</button>
      </aside>

      <div class="paper" id="paper" data-kind="outline"></div>

      <aside class="popout" data-open="false">
        <button class="grip" type="button" aria-label="Tutor">›</button>
        <div class="clip"><div class="panel"><div class="body"><div class="h">Tutor</div></div></div></div>
      </aside>
    </div>
  </div>
</div>
<div class="toast" id="toast">Saved as template</div>

<script>
(function () {
  const HINT = {
    outline: 'Numbered levels. Tab indents, Shift-Tab outdents, Enter adds a sibling.',
    title: 'Standard manuscript title page — contact, title, author.',
    bibliography: 'Hanging-indent entries. Enter adds another.',
    custom: 'Custom saves this page’s layout as a reusable template.',
    screenplay: 'Live Screenplay look (Courier, slug / action / dialogue). Reference only.',
  };
  const STAMP = {
    outline: 'TEMPLATES · OUTLINE',
    title: 'TEMPLATES · TITLE PAGE',
    bibliography: 'TEMPLATES · BIBLIOGRAPHY',
    custom: 'TEMPLATES · CUSTOM',
    screenplay: 'TEMPLATES · SCREENPLAY',
  };
  const FACE = {
    outline: 'Crimson Pro', title: 'Courier Prime', bibliography: 'Crimson Pro',
    custom: 'Crimson Pro', screenplay: 'Courier Prime', draft: 'Crimson Pro',
  };
  const FROM = {
    outline: 'Outline · numbered levels · Crimson Pro',
    title: 'Title page · manuscript · Courier Prime',
    bibliography: 'Bibliography · hanging indent · Crimson Pro',
    screenplay: 'Screenplay · slug / action / dialogue · Courier Prime',
    draft: 'Draft · Crimson Pro 18',
  };

  const SAMPLE_OL = [
    { d: 0, t: 'Night Kitchen' },
    { d: 1, t: 'The kettle' },
    { d: 1, t: 'She doesn’t turn' },
    { d: 2, t: 'Steam on the glass' },
    { d: 0, t: 'The Stairs' },
    { d: 1, t: 'What he almost says' },
  ];
  const BLANK_OL = [{ d: 0, t: '' }];

  const SAMPLE_BIB = [
    'Chen, Wei. “Steam on the Glass.” Essays from the Southside, edited by I. Voss, Relay Press, 2022, pp. 41–58.',
    'Ellison, Mara. Night Kitchen. Relay Press, 2024.',
    'Voss, Ilya. “What the Kettle Knows.” Journal of Domestic Heat, vol. 12, no. 3, 2021, pp. 88–104.',
  ];

  const CONTACT_SAMPLE = 'Mara Ellison\n14 Relay Street\nNight Kitchen, CA 90026\n(323) 555-0144\nmara@relay.example';
  const CONTACT_BLANK = '';
  const DRAFT_SAMPLE = 'The kettle ticks once and then again. She does not turn. Steam writes a small weather on the glass and she lets it.';

  let view = 'outline';
  let pageKind = 'outline';
  let fill = 'typed';
  let saveOpen = false;
  let savedName = '';
  let outline = SAMPLE_OL.map((r) => ({ ...r }));
  let bib = SAMPLE_BIB.slice();

  const paper = document.getElementById('paper');
  const hint = document.getElementById('revHint');
  const stamp = document.getElementById('stamp');
  const faceVal = document.getElementById('faceVal');
  const toast = document.getElementById('toast');
  const tmplRow = document.getElementById('tmplRow');

  function numbers(rows) {
    const c = [];
    return rows.map((r) => {
      c.length = r.d + 1;
      c[r.d] = (c[r.d] || 0) + 1;
      for (let i = r.d + 1; i < c.length; i++) c[i] = 0;
      return c.slice(0, r.d + 1).join('.');
    });
  }

  function layoutOf(v) {
    if (v === 'custom') return pageKind;
    return v;
  }

  function defaultName(v) {
    const n = { outline: 'Night Kitchen outline', title: 'Night Kitchen title', bibliography: 'Night Kitchen works cited', screenplay: 'Night Kitchen script', draft: 'Night Kitchen draft' };
    return n[layoutOf(v)] || 'Untitled template';
  }

  function renderOutline() {
    const nums = numbers(outline);
    const ul = document.createElement('ul');
    ul.className = 'ol';
    outline.forEach((row, i) => {
      const li = document.createElement('li');
      li.style.paddingLeft = (row.d * 1.6) + 'em';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = nums[i].includes('.') ? nums[i] : nums[i] + '.';
      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.contentEditable = 'true';
      txt.dataset.hint = 'Heading';
      txt.textContent = row.t;
      txt.addEventListener('input', () => { row.t = txt.textContent || ''; });
      txt.addEventListener('keydown', (e) => onOutlineKey(e, i));
      li.append(num, txt);
      ul.append(li);
      if (fill === 'blank' && i === 0) queueMicrotask(() => {
        txt.focus();
        const r = document.createRange(); r.selectNodeContents(txt); r.collapse(true);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      });
    });
    return ul;
  }

  function onOutlineKey(e, i) {
    const row = outline[i];
    if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) row.d = Math.max(0, row.d - 1);
      else {
        const prev = outline[i - 1];
        const max = prev ? prev.d + 1 : 0;
        row.d = Math.min(3, row.d + 1, max);
      }
      paint();
      queueMicrotask(() => paper.querySelectorAll('.txt')[i]?.focus());
    } else if (e.key === 'Enter') {
      e.preventDefault();
      outline.splice(i + 1, 0, { d: row.d, t: '' });
      paint();
      queueMicrotask(() => paper.querySelectorAll('.txt')[i + 1]?.focus());
    } else if (e.key === 'Backspace' && !row.t && outline.length > 1) {
      e.preventDefault();
      outline.splice(i, 1);
      paint();
      queueMicrotask(() => paper.querySelectorAll('.txt')[Math.max(0, i - 1)]?.focus());
    }
  }

  function renderBib() {
    const ul = document.createElement('ul');
    ul.className = 'bib';
    bib.forEach((entry, i) => {
      const li = document.createElement('li');
      li.contentEditable = 'true';
      li.dataset.hint = 'Author. Title. Publisher, Year.';
      li.textContent = entry;
      li.addEventListener('input', () => { bib[i] = li.textContent || ''; });
      li.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          bib.splice(i + 1, 0, '');
          paint();
          queueMicrotask(() => paper.querySelectorAll('.bib li')[i + 1]?.focus());
        }
      });
      ul.append(li);
    });
    return ul;
  }

  function renderTitle() {
    const wrap = document.createElement('div');
    wrap.className = 'ms';
    const contact = document.createElement('div');
    contact.className = 'ms-contact';
    contact.contentEditable = 'true';
    if (fill === 'typed') contact.textContent = CONTACT_SAMPLE;
    else {
      contact.classList.add('ghost');
      contact.textContent = 'Name\nAddress\nCity, ST ZIP\nPhone\nemail@example.com';
    }
    const mid = document.createElement('div');
    mid.className = 'ms-mid';
    const title = document.createElement('div');
    title.className = 'ms-title';
    title.contentEditable = 'true';
    title.dataset.hint = 'Title of the work';
    title.textContent = fill === 'typed' ? 'Night Kitchen' : '';
    const by = document.createElement('div');
    by.className = 'ms-by';
    by.textContent = 'by';
    const author = document.createElement('div');
    author.className = 'ms-author';
    author.contentEditable = 'true';
    author.dataset.hint = 'Author name';
    author.textContent = fill === 'typed' ? 'Mara Ellison' : '';
    mid.append(title, by, author);
    wrap.append(contact, mid);
    return wrap;
  }

  function renderScript() {
    const d = document.createElement('div');
    d.className = 'script';
    if (fill === 'typed') {
      d.innerHTML = '<div class="slug">INT. NIGHT KITCHEN — NIGHT</div>' +
        '<div class="act">The kettle ticks. She does not turn. Steam writes a small weather on the glass.</div>' +
        '<div class="char">MARA</div>' +
        '<div class="dial">I left the light on for a reason.</div>';
    } else {
      d.innerHTML = '<div class="slug ghost-line">INT. LOCATION - DAY<span class="caret"></span></div>' +
        '<div class="act ghost-line">Action.</div>' +
        '<div class="char ghost-line">CHARACTER</div>' +
        '<div class="dial ghost-line">Dialogue.</div>';
    }
    return d;
  }

  function renderDraft() {
    const d = document.createElement('div');
    d.className = 'draft';
    d.contentEditable = 'true';
    d.dataset.hint = '';
    d.textContent = fill === 'typed' ? DRAFT_SAMPLE : '';
    if (fill === 'blank') {
      const line = document.createElement('div');
      line.appendChild(document.createElement('span')).className = 'caret';
      return line;
    }
    return d;
  }

  function renderSaveSheet() {
    const veil = document.createElement('div');
    veil.className = 'veil';
    veil.addEventListener('click', (e) => { if (e.target === veil) { saveOpen = false; paint(); } });
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.innerHTML =
      '<div class="h">Save as template</div>' +
      '<div class="lead">Keep this page’s layout — typeface, measure, and structure — and call it back from Templates.</div>' +
      '<div class="from" id="saveFrom"></div>' +
      '<label for="saveName">Name</label>' +
      '<input id="saveName" type="text" maxlength="48" spellcheck="false">' +
      '<div class="acts"><button class="no" type="button" id="saveNo">Cancel</button>' +
      '<button class="go" type="button" id="saveGo">Save</button></div>';
    veil.append(sheet);
    queueMicrotask(() => {
      document.getElementById('saveFrom').textContent = FROM[pageKind] || FROM.draft;
      const input = document.getElementById('saveName');
      input.value = defaultName(pageKind);
      input.focus();
      input.select();
      document.getElementById('saveNo').onclick = () => { saveOpen = false; paint(); };
      document.getElementById('saveGo').onclick = () => {
        savedName = input.value.trim() || defaultName('draft');
        saveOpen = false;
        toast.textContent = 'Saved · ' + savedName;
        toast.dataset.on = 'true';
        setTimeout(() => { toast.dataset.on = 'false'; }, 1800);
        paint();
      };
    });
    return veil;
  }

  function syncSavedChip() {
    tmplRow.querySelectorAll('.saved-chip').forEach((n) => n.remove());
    if (!savedName) return;
    const b = document.createElement('button');
    b.className = 'saved-chip';
    b.type = 'button';
    b.title = savedName;
    b.textContent = savedName;
    tmplRow.append(b);
  }

  function paint() {
    const kind = pageKind;
    paper.dataset.kind = kind;
    paper.innerHTML = '';
    const kicker = document.createElement('div');
    kicker.className = 'kicker';
    kicker.textContent = kind === 'draft' ? 'Draft' : kind === 'title' ? 'Title page' : kind === 'bibliography' ? 'Bibliography' : kind === 'screenplay' ? 'Screenplay' : 'Outline';
    paper.append(kicker);

    if (kind === 'outline') paper.append(renderOutline());
    else if (kind === 'title') paper.append(renderTitle());
    else if (kind === 'bibliography') paper.append(renderBib());
    else if (kind === 'screenplay') paper.append(renderScript());
    else paper.append(renderDraft());

    const foot = document.createElement('div');
    foot.className = 'page-foot';
    foot.textContent = kind === 'outline' ? 'Tab indent · Shift-Tab out' : kind === 'bibliography' ? 'Hanging indent' : kind === 'title' ? 'Manuscript' : kind === 'screenplay' ? 'Slug · action · dialogue' : 'Page';
    paper.append(foot);

    if (saveOpen) paper.append(renderSaveSheet());

    faceVal.textContent = FACE[kind] || 'Crimson Pro';
    hint.textContent = HINT[view] || HINT.outline;
    stamp.textContent = STAMP[view] || STAMP.outline;

    document.querySelectorAll('.rig .rev[data-view]').forEach((b) => {
      b.dataset.on = b.dataset.view === view ? 'true' : 'false';
    });
    document.querySelectorAll('.rig .rev[data-fill]').forEach((b) => {
      b.dataset.on = b.dataset.fill === fill ? 'true' : 'false';
    });
    document.querySelectorAll('#tmplRow [data-tmpl]').forEach((b) => {
      const t = b.dataset.tmpl;
      b.dataset.on = (t === view || (t === 'custom' && saveOpen)) ? 'true' : 'false';
    });
    syncSavedChip();
  }

  function applyTemplate(next) {
    if (next === 'custom') {
      saveOpen = true;
      view = 'custom';
      paint();
      return;
    }
    saveOpen = false;
    view = next;
    pageKind = next;
    if (next === 'outline') outline = (fill === 'typed' ? SAMPLE_OL : BLANK_OL).map((r) => ({ ...r }));
    if (next === 'bibliography') bib = fill === 'typed' ? SAMPLE_BIB.slice() : [''];
    paint();
  }

  function setFill(next) {
    fill = next;
    if (pageKind === 'outline') outline = (fill === 'typed' ? SAMPLE_OL : BLANK_OL).map((r) => ({ ...r }));
    if (pageKind === 'bibliography') bib = fill === 'typed' ? SAMPLE_BIB.slice() : [''];
    paint();
  }

  document.querySelectorAll('.rig .rev[data-view]').forEach((b) => {
    b.addEventListener('click', () => applyTemplate(b.dataset.view));
  });
  document.querySelectorAll('.rig .rev[data-fill]').forEach((b) => {
    b.addEventListener('click', () => setFill(b.dataset.fill));
  });
  tmplRow.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tmpl]');
    if (btn) applyTemplate(btn.dataset.tmpl);
  });
  document.getElementById('sliverGrip').addEventListener('click', () => {
    const s = document.getElementById('sliver');
    s.dataset.open = s.dataset.open === 'true' ? 'false' : 'true';
  });

  const q = new URLSearchParams(location.search);
  view = q.get('t') || 'outline';
  fill = q.get('fill') === 'blank' ? 'blank' : 'typed';
  if (view === 'custom') {
    saveOpen = true;
    pageKind = 'draft';
  } else {
    pageKind = view;
  }
  if (pageKind === 'outline') outline = (fill === 'typed' ? SAMPLE_OL : BLANK_OL).map((r) => ({ ...r }));
  if (pageKind === 'bibliography') bib = fill === 'typed' ? SAMPLE_BIB.slice() : [''];
  paint();
})();
</script>
</body>
</html>
