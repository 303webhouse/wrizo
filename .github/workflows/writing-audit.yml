# The WRITING AUDIT on GitHub-hosted runners (bug #59; Fable's brief claude/writing-audit-brief.md). ADVISORY: it finds and reports, it never deploys and never stands in for a box pair. Its own workflow file and
# its own concurrency group (writing-audit-*), so a run here never cancels another lane's harness run, and theirs never cancel this one.
#
# HOW A LANE RUNS IT (plain words):
#   gh workflow run writing-audit.yml --ref audit/writing-1 -f ref=audit/writing-1 -f configs=plateau/off/light/1366,flux/off/light/1366
#   one job per config (theme/flag/tone/width); a config is theme (plateau = Arbor | flux | machina) / flag (off | on) / tone (light | dark) / width (1366 | 1920).
#   Read the result on the run page ("Findings" summary); the full log, the findings JSON and the failing steps' screenshots are the `wa-<n>` artifacts (14 days).
#
# SECURITY (the repo is PUBLIC, so every log line is public):
#   - trigger: workflow_dispatch ONLY. No push, no pull_request, no fork trigger. No secrets are referenced anywhere in this file; `permissions: contents: read`.
#   - the audit needs no account and no database: runtime-verify.mjs serves dist-web itself with an in-process auth double, and the writer's first keystroke makes the page in local storage.
#   - workflow inputs are validated and passed through env, never interpolated into a shell line. Third-party actions are pinned to full commit SHAs (the same pins as harness.yml).
name: Writing audit (live)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to test (empty = the ref this workflow was dispatched from)'
        required: false
        default: ''
      configs:
        description: 'Comma-separated theme/flag/tone/width, e.g. plateau/off/light/1366,flux/off/light/1366'
        required: true
        default: 'plateau/off/light/1366,flux/off/light/1366'
      script:
        description: 'The audit file under apps/desktop/scripts/harness/writing-audit/'
        required: true
        default: 's1-caret.mjs'
      groups:
        description: 'Optional: case groups (enter,type,del,move,select) or WA_ONLY ids as only:E01,E02'
        required: false
        default: ''

concurrency:
  group: writing-audit-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to match the box (parity): Node 24.13.0; Chrome 156 (the box's Edge is major 156); US Mountain time; en-US.
  NODE_VERSION: '24.13.0'
  CHROME_VERSION: '156.0.8078.73'
  TZ: America/Denver
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  WS_CI_RUNNER: '1'

jobs:
  plan:
    name: Plan the configs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          I_REF: ${{ inputs.ref }}
          I_CONFIGS: ${{ inputs.configs }}
          I_SCRIPT: ${{ inputs.script }}
          I_GROUPS: ${{ inputs.groups }}
        run: |
          set -eu
          if [ -n "$I_REF" ]; then printf '%s' "$I_REF" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$' || { echo "::error::ref may only hold letters, digits and . _ / -"; exit 2; }; fi
          printf '%s' "$I_SCRIPT" | grep -Eq '^[A-Za-z0-9_.-]+\.mjs$' || { echo "::error::script must be a plain *.mjs file name"; exit 2; }
          if [ -n "$I_GROUPS" ]; then printf '%s' "$I_GROUPS" | grep -Eq '^(only:)?[A-Za-z0-9,]{1,200}$' || { echo "::error::groups: letters, digits and commas only (or only:E01,E02)"; exit 2; }; fi
          node -e '
            const cfgs = process.env.I_CONFIGS.split(",").map((s) => s.trim()).filter(Boolean);
            if (!cfgs.length || cfgs.length > 12) { console.error("::error::1 to 12 configs"); process.exit(2); }
            const include = cfgs.map((c, i) => {
              const m = /^(plateau|flux|machina)\/(off|on)\/(light|dark)\/(1366|1920)$/.exec(c);
              if (!m) { console.error("::error::bad config " + c + " (want theme/flag/tone/width)"); process.exit(2); }
              return { n: i + 1, theme: m[1], flag: m[2], tone: m[3], w: m[4], h: m[4] === "1366" ? "768" : "1080", name: c };
            });
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify({ include }) + "\n");
            console.log(include.map((x) => x.name).join("  "));
          '

  audit:
    name: audit ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: build
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: build/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: build/pnpm-lock.yaml

      - name: Install from the lockfile
        working-directory: build
        run: pnpm install --frozen-lockfile

      - name: Pinned Chrome for Testing
        run: |
          set -eu
          npx --yes @puppeteer/browsers@3.2.6 install "chrome@${CHROME_VERSION}" --path "$RUNNER_TEMP/browsers" > "$RUNNER_TEMP/chrome-install.txt"
          bin="$(find "$RUNNER_TEMP/browsers" -type f -name chrome -perm -u+x | head -n 1)"
          test -x "$bin"
          echo "CLAUDE_VERIFY_BROWSER=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Build the web bundle (the tree under test, as it stands)
        working-directory: build/apps/desktop
        run: pnpm run build:web

      - name: Browserless first - the model and the verdict
        working-directory: build/apps/desktop
        run: node scripts/harness/writing-audit/model-unit.mjs

      - name: Run the audit (${{ matrix.name }})
        working-directory: build/apps/desktop
        env:
          I_SCRIPT: ${{ inputs.script }}
          I_GROUPS: ${{ inputs.groups }}
          WA_THEME: ${{ matrix.theme }}
          WA_FLAG: ${{ matrix.flag }}
          WA_TONE: ${{ matrix.tone }}
          WA_W: ${{ matrix.w }}
          WA_H: ${{ matrix.h }}
        run: |
          # a red run must not skip the copy below, so the exit code is captured, not fatal. Output goes to a FILE, never a pipe (a harness child holding a pipe open hangs the runner).
          set -u
          out="$RUNNER_TEMP/wa-out"; mkdir -p "$out"; export WA_OUT="$out"
          case "$I_GROUPS" in only:*) export WA_ONLY="${I_GROUPS#only:}" ;; '') ;; *) export WA_GROUPS="$I_GROUPS" ;; esac
          rc=0
          node "scripts/harness/writing-audit/$I_SCRIPT" > "$out/run.log" 2>&1 || rc=$?
          cat "$out/run.log"
          { echo "### ${{ matrix.name }}"; echo; echo '```'; grep -E '^(FAIL|READER PROOF|FINDINGS|PREMISE|ROWS-SHADOW)' "$out/run.log" | cut -c1-400 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Keep the log, findings and screenshots (14 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wa-${{ matrix.n }}
          path: ${{ runner.temp }}/wa-out
          retention-days: 14
          if-no-files-found: warn
