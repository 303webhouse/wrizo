# TUTOR item 7, step 1: the notes table against a REAL Postgres on a hosted runner (Fable, Nov 24: "run tutor-notes against a real Postgres on Actions").
# It starts a throwaway Postgres 16 service container on the runner, runs the server's own boot migration and the shipped notes routes against it
# (apps/server/scripts/tutor-notes-pg.mjs), and prints PASS or the failing checks. ADVISORY: it never deploys and never reaches production.
#
# HOW A LANE RUNS IT: gh workflow run tutor-notes-pg.yml --ref <the branch that holds this file> -f ref=<branch-or-sha to test>
#
# SECURITY (the repo is PUBLIC, so every log line is public):
#   - trigger: workflow_dispatch ONLY. No push, no pull_request, no pull_request_target, no fork trigger. `permissions: contents: read`.
#   - NO secrets are referenced anywhere in this file. The database is a service container that lives and dies with this one job, reachable only
#     from the runner itself (127.0.0.1); its password below is a throwaway for that container and protects nothing.
#   - the check refuses any DATABASE_URL that is not on this machine, so it cannot be pointed at anything real.
#   - the input is validated and passed through env, never interpolated into a shell line.
#   - third-party actions are pinned to full commit SHAs (the same ones as harness.yml). Nothing is uploaded.
name: Tutor notes (real Postgres)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA of this repo to test (empty = the ref this workflow was dispatched from)'
        required: false
        default: ''

concurrency:
  group: tutor-notes-pg-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.13.0'
  TZ: America/Denver
  LANG: en_US.UTF-8

jobs:
  notes-pg:
    name: Notes table on Postgres 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notes_check
          POSTGRES_PASSWORD: throwaway-container-only
          POSTGRES_DB: notes_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes_check -d notes_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check the input
        env:
          I_REF: ${{ inputs.ref }}
        run: |
          set -eu
          if [ -n "$I_REF" ]; then printf '%s' "$I_REF" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$' || { echo "::error::ref may only hold letters, digits and . _ / -"; exit 2; }; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: The notes table, the boot migration and the routes, on a real Postgres
        env:
          DATABASE_URL: postgres://notes_check:throwaway-container-only@127.0.0.1:5432/notes_check
          SESSION_SECRET: ci-check-only
        run: node apps/server/scripts/tutor-notes-pg.mjs
