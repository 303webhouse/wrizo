# Live harness on GitHub-hosted runners (docs/deploy.md "Harness on GitHub Actions"). ADVISORY, like browserless.yml: it never deploys and never
# stands in for a stamped pair on the Windows box. Any lane can run any harness file or a full pair, in parallel shards, in minutes.
#
# HOW A LANE RUNS IT (plain words):
#   one file or a few:  gh workflow run harness.yml --ref ci/actions-harness -f ref=<your-branch> -f files=a.mjs,b.mjs -f leg=both
#   the whole pair:     gh workflow run harness.yml --ref ci/actions-harness -f ref=<branch-or-sha> -f files=pair -f shards=8
#   (`--ref` picks the workflow + tooling; `ref` is the tree that is tested. Your branch does not need this file or the CI patch: the job
#    applies apps/desktop/scripts/ci-runner.patch itself when your tree lacks it. Once this is on main, drop `--ref`.)
#   Read the result on the run page: the "Pair summary" lists every non-OK file and (with box_default/box_parked) the parity against a box log;
#   the merged logs are the `pair-merged` artifact.
#
# SECURITY (the repo is PUBLIC, so every log line is public):
#   - triggers: workflow_dispatch ONLY. No push, no pull_request, no `pull_request_target`, no fork trigger.
#   - no secrets are referenced anywhere in this file; `permissions: contents: read`.
#   - the harness needs no database and never talks to a real server: runtime-verify.mjs serves dist-web itself with an in-process
#     auth/sync double, and the three files that mention DATABASE_URL set it to a placeholder. Nothing here can reach production.
#   - workflow inputs are validated and passed through env, never interpolated into a shell line.
#   - third-party actions are pinned to full commit SHAs. Uploaded: suite logs and merged logs only (14 days), never docs/evidence.
name: Harness (live)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA of this repo to test (empty = the ref this workflow was dispatched from)'
        required: false
        default: ''
      files:
        description: 'Comma-separated harness file names (e.g. machina-intake.mjs,tu2.mjs), or "pair" for every file not on the box-only list'
        required: true
        default: 'machina-intake.mjs'
      leg:
        description: 'Which leg: default, parked, or both'
        required: true
        default: 'both'
        type: choice
        options: [default, parked, both]
      shards:
        description: 'Shards per leg, 1-12 (a "pair" defaults to 8; a short file list needs 1)'
        required: false
        default: ''
      box_default:
        description: 'Optional: repo path of a box default-leg log to compare against (docs/evidence/.../x.log.txt)'
        required: false
        default: ''
      box_parked:
        description: 'Optional: repo path of a box parked-leg log to compare against'
        required: false
        default: ''

concurrency:
  group: harness-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to match the box (parity): Node 24.13.0; Chrome 156 (the box's Edge is major 156); US Mountain time; en-US.
  NODE_VERSION: '24.13.0'
  CHROME_VERSION: '156.0.8078.73'
  TZ: America/Denver
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  WS_CI_RUNNER: '1'

jobs:
  plan:
    name: Plan the shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check the inputs
        env:
          I_REF: ${{ inputs.ref }}
          I_BOX_D: ${{ inputs.box_default }}
          I_BOX_P: ${{ inputs.box_parked }}
        run: |
          set -eu
          if [ -n "$I_REF" ]; then printf '%s' "$I_REF" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$' || { echo "::error::ref may only hold letters, digits and . _ / -"; exit 2; }; fi
          for p in "$I_BOX_D" "$I_BOX_P"; do
            [ -z "$p" ] && continue
            printf '%s' "$p" | grep -Eq '^docs/evidence/[A-Za-z0-9_./-]{1,200}$' || { echo "::error::box log paths must sit under docs/evidence/"; exit 2; }
            case "$p" in *..*) echo "::error::box log paths must not climb"; exit 2 ;; esac
          done

      # the tooling: the ref this workflow was dispatched from (trusted)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false

      # the tree under test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: build
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - id: plan
        env:
          FILES_INPUT: ${{ inputs.files }}
          LEG_INPUT: ${{ inputs.leg }}
          SHARDS_INPUT: ${{ inputs.shards }}
        run: node tools/apps/desktop/scripts/ci-plan.mjs --tree build

  harness:
    name: ${{ matrix.leg }} ${{ matrix.shard }}/${{ matrix.of }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # CAP: at most 16 shard jobs at once (the free tier allows 20 per account); a pair is 2 legs x 8 shards.
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: build
          # the box checks out with FULL history (files run git show / merge-base diffs); a shallow clone fails them
          fetch-depth: 0
          persist-credentials: false

      - name: Match the box checkout (CRLF working tree)
        working-directory: build
        run: |
          set -eu
          # the box runs core.autocrlf=true: index LF, working tree CRLF. Some checks read source text, so give the runner the same bytes.
          git config core.autocrlf true
          git checkout-index --all --force
          git ls-files --eol apps/server/src/sync.ts apps/desktop/src/index.css

      - name: Make the tree CI-capable (only if it lacks the runner guard)
        working-directory: build
        run: |
          set -eu
          if grep -q isGithubHostedRunner apps/desktop/scripts/box-grant.mjs; then echo "tree already has the hosted-runner guard"; else
            git apply --ignore-whitespace "$GITHUB_WORKSPACE/tools/apps/desktop/scripts/ci-runner.patch" || { echo "::error::ci-runner.patch does not apply to this tree: rebase it onto main"; exit 2; }
            echo "applied ci-runner.patch to the tree under test"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: build/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: build/pnpm-lock.yaml

      - name: Install from the lockfile
        working-directory: build
        run: pnpm install --frozen-lockfile

      - name: Pinned Chrome for Testing
        run: |
          set -eu
          npx --yes @puppeteer/browsers@3.2.6 install "chrome@${CHROME_VERSION}" --path "$RUNNER_TEMP/browsers" > "$RUNNER_TEMP/chrome-install.txt"
          bin="$(find "$RUNNER_TEMP/browsers" -type f -name chrome -perm -u+x | head -n 1)"
          test -x "$bin"
          echo "CLAUDE_VERIFY_BROWSER=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Run the suite (${{ matrix.leg }} leg, shard ${{ matrix.shard }}/${{ matrix.of }})
        working-directory: build/apps/desktop
        env:
          LEG: ${{ matrix.leg }}
          FILE_LIST: ${{ matrix.files }}
        run: |
          # GitHub runs steps as bash -e: a red suite must not skip the copy below, so the exit code is captured, not fatal
          set -u
          out="$RUNNER_TEMP/suite"
          rc=0
          flag=""; [ "$LEG" = "parked" ] && flag="--parked"
          # output goes to a FILE, never a pipe (a harness child holding a pipe open hangs the runner)
          node scripts/run-suite.mjs --only "$FILE_LIST" $flag --out "$out" > "$RUNNER_TEMP/run.log" 2>&1 || rc=$?
          mkdir -p "$out"; cp "$RUNNER_TEMP/run.log" "$out/run.log"
          cat "$RUNNER_TEMP/run.log"
          exit $rc

      - name: Keep the suite logs (14 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-${{ matrix.leg }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/suite
          retention-days: 14
          if-no-files-found: warn

  collect:
    name: Pair summary
    needs: [plan, harness]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suite-*
          path: suites

      - name: Merge the shards
        env:
          I_BOX_D: ${{ inputs.box_default }}
          I_BOX_P: ${{ inputs.box_parked }}
        run: |
          set -u
          rc=0
          extra=""
          [ -n "$I_BOX_D" ] && [ -f "$I_BOX_D" ] && extra="$extra --box-default $I_BOX_D"
          [ -n "$I_BOX_P" ] && [ -f "$I_BOX_P" ] && extra="$extra --box-parked $I_BOX_P"
          node apps/desktop/scripts/ci-merge.mjs --in suites --out merged $extra > "$RUNNER_TEMP/merge.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/merge.txt"
          [ -f merged/summary.md ] && cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Keep the merged logs (14 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pair-merged
          path: merged
          retention-days: 14
          if-no-files-found: warn
